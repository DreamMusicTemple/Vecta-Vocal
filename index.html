<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root, [data-theme="neon"] {
  --bg: #0A0B0F; --bar: #0E1016; --panel: #12141B; --panel-top: #181B23; --well: #0A0B0F; --control: #1B1F2A; --border: #232733; --track: #2A2F3D;
  --text: #E8ECF4; --dim: #8A93A6; --silk: #B3BAC9; --cyan: #22E4FF; --magenta: #FF3DA6; --lime: #B6FF3C; --amber: #FFB020; --on-accent: #06222A;
  --edge: #000; --edge-w: 1px; --radius: 6px; --highlight: rgba(255,255,255,.06); --shadow: rgba(0,0,0,.45);
  --btn-top: #303030; --btn-bot: #1c1c1c; --btn-on-top: #1c1c1c; --btn-on-bot: #262626; --led-off: #292929;
  --screw-light: #4a4f5a; --screw-dark: #111;
  --key-white: #DBDEE5; --key-white-out: #8c8c8c; --key-black: #0A0B0F; --key-black-out: #050505;
  --knob-rim: #3a3e48; --knob-body: #1c1e25; --knob-cap-top: #4d4d4d; --knob-cap: #2b2e36; --knob-cap-bot: #141414; --knob-pointer: #E8ECF4;
  --tab-text: rgba(232,236,244,.75); --overlay: rgba(5,6,8,.82); --title-weight: 600; --title-style: normal;
  --panel-texture: none;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
body { display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; background: var(--bar); border-bottom: 1px solid var(--border); flex: none; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .15em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.badge { font: 10px var(--mono); color: var(--cyan); border: 1px solid var(--cyan); border-radius: 3px; padding: 1px 4px; letter-spacing: 0; }
.preset-stepper { display: flex; align-items: center; gap: 2px; }
.icon-btn { width: 44px; height: 40px; border: 0; background: none; display: grid; place-items: center; border-radius: 6px; color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.active { color: var(--cyan); }
.preset-name { min-width: 180px; max-width: 260px; min-height: 40px; padding: 2px 12px; background: var(--control); border: 1px solid var(--track); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.preset-name b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.preset-name small { font-size: 8px; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
.tabs { display: flex; gap: 4px; }
.tab { min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--tab-text); font-weight: 700; font-size: 12px; letter-spacing: .1em; }
.tab[aria-selected="true"] { background: var(--cyan); color: var(--on-accent); }
.spacer { flex: 1; }
.status { font: 11px var(--mono); color: var(--dim); white-space: nowrap; }

/* pages */
main { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
.page { display: none; }
.page.active { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 8px; align-items: start; }
.grid.mixer { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); margin-bottom: 10px; }
.panel { position: relative; border: 1px solid #000; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  box-shadow: inset 0 1px 0 var(--highlight), 0 2px 4px var(--shadow);
  border-color: var(--edge); border-width: var(--edge-w); border-radius: var(--radius);
  background:
    var(--screws, radial-gradient(circle at 8px 8px, var(--screw-light) 0 2.2px, var(--screw-dark) 2.6px, transparent 3.2px),
    radial-gradient(circle at calc(100% - 8px) 8px, var(--screw-light) 0 2.2px, var(--screw-dark) 2.6px, transparent 3.2px),
    radial-gradient(circle at 8px calc(100% - 8px), var(--screw-light) 0 2.2px, var(--screw-dark) 2.6px, transparent 3.2px),
    radial-gradient(circle at calc(100% - 8px) calc(100% - 8px), var(--screw-light) 0 2.2px, var(--screw-dark) 2.6px, transparent 3.2px)),
    var(--panel-texture),
    linear-gradient(180deg, var(--panel-top), var(--panel)); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel-title { font-size: 10px; font-weight: var(--title-weight); font-style: var(--title-style); letter-spacing: .14em; text-transform: uppercase; color: var(--silk) !important; display: flex; align-items: center; gap: 8px; }
.panel-title::before { content: ''; width: 3px; height: 11px; border-radius: 1px; background: var(--title-accent, var(--dim)); }
.panel-trailing { font: 10px var(--mono); color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.note { font-size: 11px; color: var(--dim); line-height: 1.4; margin: 0; }
.wide { grid-column: 1 / -1; }

/* knob */
.knob { width: 70px; display: flex; flex-direction: column; align-items: center; gap: 3px; touch-action: none; cursor: ns-resize; }
.knob svg { width: 66px; height: 66px; overflow: visible; }
.knob .val { font: 10px var(--mono); white-space: nowrap; min-width: 46px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; text-align: center; padding: 1px 4px;
  background: var(--well); border: 1px solid var(--edge); border-radius: 3px; }
.knob .lbl { font-size: 8.5px; font-weight: var(--title-weight); font-style: var(--title-style); letter-spacing: .08em; text-transform: uppercase; color: var(--silk); white-space: nowrap; max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
.knob.small { width: 60px; }
.knob.small svg { width: 56px; height: 56px; }

/* LED buttons and push buttons */
.pill { min-height: 38px; min-width: 64px; padding: 0 11px; border-radius: 5px; border: var(--edge-w) solid var(--edge); display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); color: var(--silk); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--highlight), 0 1.5px 2px var(--shadow); }
.pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--led-off); border: 1px solid rgba(0,0,0,.5); flex: none; }
.pill[aria-pressed="true"] { background: linear-gradient(180deg, var(--btn-on-top), var(--btn-on-bot)); color: var(--text); border-color: color-mix(in srgb, var(--accent, var(--cyan)) 70%, var(--edge));
  box-shadow: inset 0 1px 2px var(--shadow); }
.pill[aria-pressed="true"] .led { background: var(--accent, var(--cyan)); box-shadow: 0 0 6px var(--accent, var(--cyan)); }
.btn { min-height: 40px; padding: 0 12px; border-radius: 5px; border: var(--edge-w) solid var(--edge); background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--highlight), 0 1.5px 2px var(--shadow); }
.btn.filled { background: linear-gradient(180deg, var(--accent, var(--cyan)), color-mix(in srgb, var(--accent, var(--cyan)) 78%, #000)); color: var(--on-accent); }
.btn.small { min-height: 30px; padding: 0 8px; font-size: 10px; }
.select { display: flex; flex-direction: column; gap: 2px; }
.select span { font-size: 8px; font-weight: 600; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.select select { min-height: 44px; min-width: 84px; padding: 0 28px 0 10px; background: var(--well); color: var(--accent, var(--cyan)); border: var(--edge-w) solid var(--edge); border-radius: 5px; font: 600 12px var(--mono); letter-spacing: .02em; text-transform: uppercase; appearance: none; -webkit-appearance: none;
  text-shadow: 0 0 6px color-mix(in srgb, var(--accent, var(--cyan)) 60%, transparent); box-shadow: inset 0 1px 3px var(--shadow);
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 19px, calc(100% - 10px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }

/* layer cards */
.layer-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 10px; }
.layer-card.selected { border: 2px solid var(--accent); padding: 9px; }
.layer-tag { width: 40px; height: 44px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font: 600 13px var(--mono); flex: none; }
.layer-card .stack { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.layer-card .stack select { width: 100%; }
.voice-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.voice-row .quick { display: flex; flex-direction: column; gap: 4px; }

/* vowel pad, meters, canvases */
.pad { position: relative; height: 250px; background: var(--well); border-radius: 6px; touch-action: none; cursor: crosshair; }
.pad svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.layer-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.layer-pick button { min-height: 40px; border: 0; border-radius: 6px; background: var(--control); color: var(--accent); font: 600 12px var(--mono); }
.layer-pick button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.meter { height: 8px; border-radius: 4px; background: var(--well); overflow: hidden; flex: 1; }
.meter i { display: block; height: 100%; width: 0; background: var(--lime); border-radius: 4px; }
.meter.rev { display: flex; justify-content: flex-end; }
.meter-row { display: flex; align-items: center; gap: 8px; font: 10px var(--mono); }
.meter-row .name { width: 84px; font: 600 12px var(--sans); }
.meter-row .num { width: 64px; text-align: right; }
canvas.analyser { width: 100%; height: 220px; display: block; background: var(--well); border-radius: 6px; touch-action: none; }
.bands { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.band { background: color-mix(in srgb, var(--control) 60%, transparent); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.band .panel-title { color: var(--magenta); }
.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--tab-text); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
textarea, input[type="text"] { width: 100%; background: var(--well); border: 1px solid var(--track); border-radius: 6px; padding: 10px; color: var(--text); -webkit-user-select: text; user-select: text; }
input.seq { font: 600 16px var(--mono); min-height: 44px; }
video.face-preview { width: 160px; height: 120px; object-fit: cover; transform: scaleX(-1); border-radius: 6px; background: var(--well); }

/* keyboard */
.keyboard-wrap { flex: none; display: flex; gap: 8px; padding: 0 12px 10px; height: 114px; }
.keyboard-wrap.hidden { display: none; }
.oct { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 11px var(--mono); color: var(--dim); }
.oct button { width: 44px; height: 34px; border: 0; border-radius: 6px; background: var(--control); font-weight: 700; }
.keys { position: relative; flex: 1; touch-action: none; }
.keys .white { position: absolute; top: 0; bottom: 0; background: var(--key-white); border-radius: 0 0 4px 4px; border: 1px solid var(--bg); }
.keys .black { position: absolute; top: 0; height: 58%; background: var(--key-black); border: 1px solid var(--track); border-top: 0; border-radius: 0 0 3px 3px; z-index: 1; }
.keys .down { background: var(--cyan) !important; }

/* overlays */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.overlay.open { display: flex; }
.sheet { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bar); border-bottom: 1px solid var(--border); }
.sheet-head h2 { margin: 0; font-size: 14px; letter-spacing: .15em; flex: 1; }
.sheet-body { padding: 12px; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 12px; }
.sheet-body.single { display: block; }
@media (max-width: 700px) { .sheet-body { grid-template-columns: 1fr; } }
.bank-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.bank-tabs button { min-height: 40px; border: 0; border-radius: 6px; background: var(--control); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.bank-tabs button[aria-pressed="true"] { background: var(--cyan); color: var(--on-accent); }
.preset-list { display: flex; flex-direction: column; gap: 4px; max-height: 52vh; overflow-y: auto; }
.preset-item { min-height: 44px; padding: 4px 10px; text-align: left; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; justify-content: center; }
.preset-item b { font-size: 14px; }
.preset-item small { font-size: 9px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
.preset-item[aria-selected="true"] { background: var(--control); border-color: var(--cyan); }
.preset-item .playing { color: var(--cyan); }
.field-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; color: var(--dim); margin: 6px 0 4px; }
.settings section { margin-bottom: 18px; }
.settings h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
.settings .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 14px; }
.settings .line:first-of-type { border-radius: 8px 8px 0 0; }
.settings .line:last-of-type { border-radius: 0 0 8px 8px; border-bottom: 0; }
.settings .line span:last-child { color: var(--dim); text-align: right; }
.manual h4 { color: var(--cyan); margin: 18px 0 6px; font-size: 17px; }
.manual p { white-space: pre-line; font-size: 14px; line-height: 1.5; margin: 0; -webkit-user-select: text; user-select: text; }
.start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); text-align: center; padding: 24px; }
.start h1 { margin: 0; letter-spacing: .25em; font-size: 26px; }
.start p { margin: 0; color: var(--dim); max-width: 420px; line-height: 1.5; }
.start .btn { min-height: 52px; padding: 0 28px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--control); border: 1px solid var(--track); border-radius: 8px; padding: 10px 16px; font-size: 13px; z-index: 30; display: none; max-width: 90vw; }
.toast.show { display: block; }

/* performance strip */
.keyboard-wrap { height: 126px; padding: 8px; margin: 0 12px 10px; border: var(--edge-w) solid var(--edge); border-radius: var(--radius); background: linear-gradient(180deg, var(--panel-top), var(--panel)); }
.perf { display: flex; gap: 8px; align-items: stretch; }
.wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 8.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--silk); }
.wheel { position: relative; width: 30px; flex: 1; border-radius: 4px; border: 1px solid var(--edge); touch-action: none; cursor: ns-resize;
  background: repeating-linear-gradient(180deg, var(--highlight) 0 1px, transparent 1px 6px), var(--well); }
.wheel i { position: absolute; left: 3px; right: 3px; height: 8px; border-radius: 2px; }
.perf-col { display: flex; flex-direction: column; gap: 5px; justify-content: center; }
.bend-switches { display: flex; gap: 3px; }
.bend-sw { width: 17px; height: 30px; border: 0; border-radius: 3px; background: var(--well); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font: 600 9px var(--mono); color: var(--silk); padding: 0; }
.bend-sw .led { width: 6px; height: 6px; border-radius: 50%; background: var(--led-off); }
.bend-sw[aria-pressed="true"] .led { background: var(--accent); box-shadow: 0 0 4px var(--accent); }
.oct button { width: 32px; height: 28px; }
.keys .white.out { background: var(--key-white-out); }
.keys .black.out { background: var(--key-black-out); }
.keys .blocked { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.28) 0 1px, transparent 1px 6px) !important; }
.keys .in::after, .keys .root::after { content: ''; position: absolute; left: 3px; right: 3px; bottom: 4px; height: 4px; border-radius: 1.5px; background: color-mix(in srgb, var(--cyan) 80%, transparent); }
.keys .root::after { height: 6px; background: var(--magenta); }

/* scale strip, chain */
.scale-strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.note-cell { font: 600 11px var(--mono); text-align: center; padding: 6px 0; border-radius: 3px; background: var(--well); color: var(--dim); }
.note-cell.in { background: var(--lime); color: var(--on-accent); }
.note-cell.root { background: var(--magenta); color: var(--on-accent); }
.chain { gap: 6px; }
.chain-slot { display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--well); border-radius: 5px; }
.chain-num { width: 16px; text-align: center; font: 10px var(--mono); color: var(--dim); }
.chain-arrows { display: flex; flex-direction: column; gap: 2px; }
.arrow { width: 28px; height: 19px; border: 0; border-radius: 3px; background: var(--control); font-weight: 700; padding: 0; line-height: 1; }
.arrow:disabled { color: var(--track); }
.chain-slot .pill { min-width: 104px; }

/* manual */
.manual details { border-bottom: 1px solid var(--border); }
.manual summary { cursor: pointer; padding: 10px 4px; list-style: none; display: flex; align-items: center; gap: 8px; }
.manual summary::before { content: '▸'; color: var(--cyan); transition: transform .15s; }
.manual details[open] > summary::before { transform: rotate(90deg); }
.manual .man-chapter > summary { color: var(--cyan); font-weight: 700; font-size: 16px; }
.manual .man-section { margin-left: 16px; }
.manual .man-section > summary { font-weight: 600; font-size: 14px; }
.manual .man-section p { white-space: pre-line; font-size: 14px; line-height: 1.5; margin: 0 0 12px 20px; -webkit-user-select: text; user-select: text; }

/* ---------------------------------------------------------------- interface designs (Settings > Interface design) */
[data-theme="metal"] {
  --bg: #16181B; --bar: #1E2024; --panel: #34383E; --panel-top: #4A4F57; --well: #0F1012; --control: #2A2D32; --border: #555B63; --track: #5F656E;
  --text: #F2F3F5; --dim: #A7ADB6; --silk: #D4D8DE; --cyan: #FF7A1A; --magenta: #4FA3FF; --lime: #E8E8E8; --amber: #FFCC33; --on-accent: #111214;
  --btn-top: #5B6068; --btn-bot: #3A3E44; --btn-on-top: #2E3136; --btn-on-bot: #3A3E44; --led-off: #2A1A10; --radius: 3px;
  --screw-light: #D8DCE0; --screw-dark: #6A7078; --key-white: #E6E8EB; --key-white-out: #8E949C; --key-black: #1A1C1F; --key-black-out: #0D0E10;
  --knob-rim: #C9CDD3; --knob-body: #8E949C; --knob-cap-top: #EEF0F2; --knob-cap: #B5BAC1; --knob-cap-bot: #6E747C; --knob-pointer: #111214;
  --tab-text: rgba(242,243,245,.8); --highlight: rgba(255,255,255,.10);
  --panel-texture: repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,.025) 1px 2px, transparent 2px 3px);
}
[data-theme="nature"] {
  --bg: #0C1610; --bar: #112017; --panel: #172A1D; --panel-top: #203826; --well: #08100A; --control: #1E3324; --border: #2D4A33; --track: #3A5A3F;
  --text: #EAF2E1; --dim: #9DB59A; --silk: #C9D9BE; --cyan: #8BD450; --magenta: #F28DB2; --lime: #6EC3D4; --amber: #F2C14E; --on-accent: #0C1610;
  --btn-top: #2A4430; --btn-bot: #1A2D1F; --btn-on-top: #16261A; --btn-on-bot: #1E3324; --led-off: #1C2A1E; --edge: #040805; --radius: 12px;
  --screws: linear-gradient(transparent, transparent); --highlight: rgba(232,245,208,.06);
  --key-white: #EDE6D3; --key-white-out: #9C9682; --key-black: #2B1C10; --key-black-out: #170F08;
  --knob-rim: #A06A3E; --knob-body: #5C3A20; --knob-cap: #7A4E2C; --knob-pointer: #F4E8D0; --tab-text: rgba(234,242,225,.78);
  --panel-texture: repeating-radial-gradient(ellipse 140% 60% at 30% -20%, transparent 0 9px, rgba(0,0,0,.06) 9px 10px);
}
[data-theme="mecha"] {
  --bg: #0A0F22; --bar: #0F1630; --panel: #18214A; --panel-top: #22306A; --well: #060A18; --control: #1C2858; --border: #F5F5F5; --track: #34437E;
  --text: #FFFFFF; --dim: #A9B4DC; --silk: #FFFFFF; --cyan: #FFD400; --magenta: #FF2A3D; --lime: #29A8FF; --amber: #F5F5F5; --on-accent: #0A0F22;
  --btn-top: #2C3B7A; --btn-bot: #1C2858; --btn-on-top: #121A40; --btn-on-bot: #1C2858; --led-off: #2A2F48; --edge-w: 2px; --radius: 2px;
  --screw-light: #FFD400; --screw-dark: #8A7300; --shadow: rgba(0,0,0,.7);
  --key-white: #FFFFFF; --key-white-out: #8C93B0; --key-black: #0A0F22; --key-black-out: #05070F;
  --knob-rim: #F5F5F5; --knob-body: #D9DEEC; --knob-cap: #FFFFFF; --knob-pointer: #FF2A3D; --tab-text: #FFFFFF; --title-weight: 900; --title-style: italic;
  --panel-texture: repeating-linear-gradient(-45deg, var(--cyan) 0 6px, #000 6px 12px) bottom / 100% 5px no-repeat,
    radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.4px) 0 0 / 7px 7px;
}
[data-theme="mecha"] .panel { box-shadow: 4px 4px 0 #000; }
[data-theme="mecha"] .tab[aria-selected="true"] { transform: skewX(-12deg); }
[data-theme="mecha"] .brand { font-style: italic; font-weight: 900; }
[data-theme="mecha"] .pill, [data-theme="mecha"] .btn { box-shadow: 2px 2px 0 #000; }
[data-theme="snow"] {
  --bg: #E9EFF5; --bar: #F6F9FC; --panel: #E8EEF4; --panel-top: #FFFFFF; --well: #D6E0EA; --control: #F4F7FA; --border: #C3D0DC; --track: #B5C4D2;
  --text: #1B2531; --dim: #5B6D80; --silk: #34465A; --cyan: #1E8FD6; --magenta: #D6336C; --lime: #2E9E6A; --amber: #DB8400; --on-accent: #FFFFFF;
  --btn-top: #FFFFFF; --btn-bot: #E3EAF1; --btn-on-top: #D6E0EA; --btn-on-bot: #E3EAF1; --led-off: #C9D4DF; --edge: #8A9BAC; --radius: 12px;
  --screws: linear-gradient(transparent, transparent); --highlight: rgba(255,255,255,.9); --shadow: rgba(40,70,100,.14);
  --key-white: #FFFFFF; --key-white-out: #C5D0DB; --key-black: #2B3A4A; --key-black-out: #5B6D80;
  --knob-rim: #FFFFFF; --knob-body: #E2E8EE; --knob-cap: #FAFCFD; --knob-pointer: #1B2531; --tab-text: #34465A; --overlay: rgba(200,212,224,.75);
  --panel-texture: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0) 18px);
}
[data-theme="snow"] .select select { text-shadow: none; }
[data-theme="snow"] .pill[aria-pressed="true"] .led { box-shadow: 0 0 4px var(--accent, var(--cyan)); }

/* knob bodies and pointers: each design shows its own */
.knob .kb, .knob .kp { display: none; }
[data-theme="neon"] .knob .kb-machined, [data-theme="neon"] .knob .kp-machined,
[data-theme="metal"] .knob .kb-chrome, [data-theme="metal"] .knob .kp-chrome,
[data-theme="nature"] .knob .kb-wood, [data-theme="nature"] .knob .kp-wood,
[data-theme="mecha"] .knob .kb-mecha, [data-theme="mecha"] .knob .kp-mecha,
[data-theme="snow"] .knob .kb-porcelain, [data-theme="snow"] .knob .kp-porcelain { display: inline; }
[data-theme="mecha"] .knob .tick { stroke-width: 4px; stroke-linecap: butt; }

/* top bar keyboard toggle */
.kbd-toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--track); background: none; color: var(--dim);
  font-size: 10px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.kbd-toggle svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.kbd-toggle.active { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 60%, transparent); }

/* vectors */
.vpad { position: relative; width: 100%; max-width: 460px; aspect-ratio: 1; margin: 0 auto; background: var(--well); border-radius: 6px; border: var(--edge-w) solid var(--edge); touch-action: none; cursor: crosshair; overflow: hidden; }
.vpad svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.vpad .corner { position: absolute; font: 700 12px var(--mono); }
.vpad .finger { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--text) 70%, transparent); pointer-events: none; }
.vpad .dot { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); pointer-events: none; }
.vpad.off .dot { background: var(--dim); box-shadow: none; }
.vmix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.vmix div { display: flex; flex-direction: column; gap: 3px; font: 9px var(--mono); color: var(--dim); }
.rec { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 5px; border: var(--edge-w) solid color-mix(in srgb, var(--magenta) 70%, var(--edge));
  background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.rec i { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--magenta) 50%, transparent); }
.rec[data-state="1"] i { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: blink .5s steps(2) infinite; }
.rec[data-state="2"] i { background: var(--magenta); box-shadow: 0 0 8px var(--magenta); }
@keyframes blink { 50% { opacity: .2; } }
.progress { height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--cyan); }
.progress.rec-on i { background: var(--magenta); }
.vstatus { font: 11px var(--mono); }
.corner-row { display: flex; align-items: center; gap: 8px; font: 11px var(--mono); }
.corner-row b { width: 26px; }
.corner-row .eng { flex: 1; }
.corner-row .lv { color: var(--dim); font-size: 10px; }

/* arpeggiator pattern */
.steps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.step { min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 2px; padding: 0; font: 9px var(--mono); color: var(--dim); }
.step i { display: block; height: 16px; border-radius: 3px; background: var(--amber); box-shadow: 0 0 5px color-mix(in srgb, var(--amber) 60%, transparent); }
.step[data-v="0"] i { background: var(--led-off); box-shadow: none; }
.step[data-v="2"] i { height: 22px; background: var(--magenta); box-shadow: 0 0 6px color-mix(in srgb, var(--magenta) 60%, transparent); }
.step.inactive { opacity: .3; }
.step.now i { outline: 2px solid var(--text); outline-offset: 1px; }
.tempo-sync { font: 600 12px var(--mono); color: var(--lime); }

/* theme picker */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.theme-card { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); min-height: 64px; }
.theme-card[aria-pressed="true"] { border: 2px solid var(--cyan); padding: 9px; }
.theme-card b { font-size: 14px; display: block; }
.theme-card small { font-size: 11px; color: var(--dim); line-height: 1.35; display: block; }
.swatch { width: 64px; height: 40px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid rgba(0,0,0,.5); }
.swatch .k { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,.5); }
.swatch .dots { display: grid; grid-template-columns: 7px 7px; gap: 3px; }
.swatch .dots i { width: 7px; height: 7px; border-radius: 50%; }

</style>
</head>

    this.tN = 0; this.lipPrev = 0; this.lastEngine = -1;
    this.F = { f: [0, 0, 0, 0, 0], bw: [0, 0, 0, 0, 0], a: [0, 0, 0, 0, 0] };

  active() { return this.envStage !== 0; }
  resetFilters() {
    for (let k = 0; k < 5; ++k) { this.fs[k].reset(); this.ry1[k] = this.ry2[k] = 0; this.fa[k] = 0; this.pulseT[k] = -1; }
    for (let b = 0; b < kMaxBands; ++b) { this.vs[b].reset(); this.vgs[b] = 0; }
    this.tR.fill(0); this.tL.fill(0); this.jR.fill(0); this.jL.fill(0); this.diam.fill(1.5);

  trigger(seed) {

  render(c, n, sr, quality, out, count) {
    if (this.envStage === 0) return false;
    if (c.engine !== this.lastEngine) { this.resetFilters(); this.lastEngine = c.engine; }
    const blockRate = sr / count, shapeC = onePoleCoef(0.004, blockRate);
    const rng = this.rng;

    this.driftCount -= count;
    if (this.driftCount <= 0) { this.driftCount = Math.floor((0.04 + rng.uni() * 0.12) * sr); this.driftTarget = rng.bi(); }
    this.drift += (this.driftTarget - this.drift) * onePoleCoef(0.12, blockRate);
    const raw = n.pitch + (c.bendOn ? n.bend : 0) + c.transpose + this.drift * c.human * 0.22 + rng.bi() * c.human * 0.02;
    if (c.tuneOn) {
      const target = snapToScale(raw, c.key, c.mask);
      if (!this.pitchInit) this.corr = target; else this.corr += (target - this.corr) * onePoleCoef(c.tuneSpeed, blockRate);
    } else this.corr = raw;
    this.pitchInit = true;

    const inc = this.inc, lv = this.lv;
    inc[0] = clampf(midiToHz(this.corr) / sr, 1e-5, 0.45); lv[0] = 1;
    let power = 1;
    for (let h = 0; h < kNumHarm; ++h) {
      const hc = c.harm[h];
      if (hc.on && hc.level > 0.001) {
        let p = this.corr + hc.semis;
        if (c.tuneOn) p = snapToScale(p, c.key, c.mask);
        p += hc.fine * 0.01;
        inc[h + 1] = clampf(midiToHz(p) / sr, 1e-5, 0.45); lv[h + 1] = hc.level; power += hc.level * hc.level;

    const norm = 1 / Math.sqrt(power);

    const vx = n.hasVowel ? n.vowelX : c.vowelX, vy = n.hasVowel ? n.vowelY : c.vowelY;
    const tense = clampf(c.tense + 0.35 * n.pressure + 0.2 * (n.velocity - 0.6), 0, 1);
    const f0 = inc[0] * sr;
    const glotA = 1 - Math.exp(-kTwoPi * clampf(f0 * (1.5 + tense * tense * 36), 200, sr * 0.45) / sr);
    const noiseA = 1 - Math.exp(-kTwoPi * 900 / sr);
    const breath = c.breath, voiced = 1 - 0.5 * breath;
    const F = this.F;
    let tractIn = 0, tOS = 1, fofTa = 1, fofNorm = 1, pulseMix = 0, noiseMix = 0;

    if (c.engine === E.Articulatory) {
      tOS = quality >= 1 && sr < 50000 ? 2 : 1;
      const fsT = sr * tOS, lenScale = c.throat / c.shiftRatio, tw = this.tw;
      tractWeights(vx, vy, tw);
      const N = clampf(Math.floor(17.5 * lenScale * fsT / 35000 + 0.5), 8, kMaxTract - 1);
      if (N !== this.tN) {
        for (let i = N; i < kMaxTract; ++i) { this.tR[i] = this.tL[i] = 0; }
        if (this.tN === 0) for (let i = 0; i < N; ++i) this.diam[i] = tractDiameter((i + 0.5) / N, tw, c.shapeA, c.shapeB);
        this.tN = N;
      }
      for (let i = 0; i < N; ++i) this.diam[i] += shapeC * (tractDiameter((i + 0.5) / N, tw, c.shapeA, c.shapeB) - this.diam[i]);
      for (let i = 1; i < N; ++i) {
        const a0 = this.diam[i - 1] * this.diam[i - 1], a1 = this.diam[i] * this.diam[i];

    } else {
      vowelFormants(vx, vy, F);
      const scale = c.shiftRatio / c.throat;
      for (let k = 0; k < 5; ++k) F.f[k] = clampf(F.f[k] * scale, 60, sr * 0.45);
      if (c.engine === E.Formant) {
        const res = Math.pow(2, lerp(-1.2, 1.6, c.shapeA)), pres = dbToLin(c.shapeB * 14);
        for (let k = 0; k < 5; ++k) {
          this.fc[k].bandpass(F.f[k], clampf(F.f[k] / F.bw[k] * res, 0.7, 60), sr);
          const a = F.a[k] * (k >= 2 ? pres : 1);
          this.fa[k] += shapeC * (a - this.fa[k]);

      } else if (c.engine === E.FOF) {
        const bwScale = Math.pow(2, lerp(1.6, -1.6, c.shapeB));
        for (let k = 0; k < 5; ++k) {
          const r = Math.exp(-kPi * F.bw[k] * bwScale / sr), w = kTwoPi * F.f[k] / sr;
          this.rc1[k] = 2 * r * Math.cos(w); this.rc2[k] = r * r; this.rg[k] = Math.sin(w);
          this.fa[k] += shapeC * (F.a[k] - this.fa[k]);
        }
        fofTa = Math.max(2, lerp(0.00015, 0.004, c.shapeA * c.shapeA) * sr);
        fofTa = Math.min(fofTa, 0.9 / inc[0]);
        fofNorm = 2 / fofTa;
      } else {
        const nb = 6 + Math.floor(c.shapeA * 18 + 0.5);

          const lo = 110, hi = Math.min(9000, sr * 0.42), bwOct = Math.log2(hi / lo) / (nb - 1);
          const p2 = Math.pow(2, bwOct * 0.85), q = Math.sqrt(p2) / (p2 - 1);
          for (let b = 0; b < nb; ++b) { this.vFreq[b] = lo * Math.pow(hi / lo, b / (nb - 1)); this.vc[b].bandpass(this.vFreq[b], q, sr); this.vs[b].reset(); }
        }
        const fromInput = c.vocSource === 1 && n.input !== null;
        for (let b = 0; b < this.vBands; ++b) {
          if (fromInput) { const e = n.input.at(this.vFreq[b]) * 40; this.vg[b] = e / (1 + e); continue; }
          let e = 0;
          for (let k = 0; k < 5; ++k) {
            const u = (this.vFreq[b] - F.f[k]) / (Math.max(F.bw[k], 60) * 1.2 + this.vFreq[b] * 0.05);
            e += F.a[k] / (1 + u * u);
          }
          this.vg[b] = e;
        }

        noiseMix = clampf(c.shapeB * 2 - 1, 0, 1) * 0.7;
      }

    const aC = onePoleCoef(c.attack * 0.35, sr), dC = onePoleCoef(c.decay * 0.35, sr), rC = onePoleCoef(c.release * 0.25, sr);

    const tR = this.tR, tL = this.tL, jR = this.jR, jL = this.jL, refl = this.refl;
    const fa = this.fa, fc = this.fc, fs = this.fs, rg = this.rg, rc1 = this.rc1, rc2 = this.rc2, ry1 = this.ry1, ry2 = this.ry2;
    const vc = this.vc, vs = this.vs, vg = this.vg, vgs = this.vgs, vBands = this.vBands;

    for (let i = 0; i < count; ++i) {

      else { env += rC * (0 - env); if (env < 0.0004) { env = 0; envStage = 0; } }

      let y = 0;
      if (c.engine === E.FOF) {
        let ex = 0;
        for (let k = 0; k < 5; ++k) {
          if (lv[k] <= 0) continue;
          phase[k] += inc[k];
          if (phase[k] >= 1) { phase[k] -= 1; pulseT[k] = 0; }
          if (pulseT[k] >= 0) {
            ex += lv[k] * 0.5 * (1 - Math.cos(kTwoPi * pulseT[k] / fofTa));

            if (pulseT[k] >= fofTa) pulseT[k] = -1;
          }
        }
        ex *= fofNorm * norm;
        const nz = rng.bi();
        noiseLP += noiseA * (nz - noiseLP);
        ex = ex * voiced + (nz - noiseLP) * breath * 0.05;
        for (let k = 0; k < 5; ++k) {
          const r = rg[k] * ex + rc1[k] * ry1[k] - rc2[k] * ry2[k];

        let src = 0, pul = 0;
        for (let k = 0; k < 5; ++k) {
          if (lv[k] <= 0) continue;

            let p2 = phase[k] + 0.3; if (p2 >= 1) p2 -= 1;
            pul += lv[k] * (s - (2 * p2 - 1 - polyblep(p2, inc[k])));
          }

        if (pulseMix > 0) src = lerp(src, pul, pulseMix);
        src *= norm;
        glot += glotA * (src - glot);
        const nz = rng.bi();
        noiseLP += noiseA * (nz - noiseLP);
        const asp = (nz - noiseLP) * (0.35 + 0.65 * (1 - phase[0])) * breath;
        let x = glot * voiced + asp * 0.6;
        if (c.engine === E.Formant) {
          for (let k = 0; k < 5; ++k) y += fa[k] * fs[k].tick(fc[k], x);
          y *= 3.0;
        } else if (c.engine === E.Articulatory) {
          const xin = x * tractIn;
          let lip = 0;
          for (let s = 0; s < tOS; ++s) {
            jR[0] = tL[0] * 0.75 + xin;
            jL[N] = tR[N - 1] * -0.85;
            for (let j = 1; j < N; ++j) { const w = refl[j] * (tR[j - 1] + tL[j]); jR[j] = tR[j - 1] - w; jL[j] = tL[j] + w; }

          x += nz * noiseMix * 0.5;

          y *= 0.9;
        }
      }
      out[i] += y * env * velGain;
    }
    this.env = env; this.envStage = envStage; this.glot = glot; this.noiseLP = noiseLP; this.lipPrev = lipPrev;
    for (let k = 0; k < 5; ++k) { ry1[k] = undenorm(ry1[k]); ry2[k] = undenorm(ry2[k]); }
    for (let j = 0; j < N; ++j) { tR[j] = undenorm(tR[j]); tL[j] = undenorm(tL[j]); }
    if (!(this.env === this.env) || Math.abs(this.env) > 4) { this.kill(); this.resetFilters(); }
    return this.envStage !== 0;
  }
}

// Colour models: a short filter chain plus saturation. Kinds: 1 peak, 2 low shelf, 3 high shelf, 4 low pass, 5 high pass.

class ColourModel {
  constructor(specs) { this.specs = specs; this.f = [0, 1, 2, 3, 4].map(() => new StereoBiquad()); this.count = 0; this.model = -1; this.prox = -1; this.sr = 0; this.sat = 0; this.satGain = 1; this.drive = 0; }
  update(m, proximity, d, sr) {
    this.drive = d;
    if (m === this.model && proximity === this.prox && sr === this.sr) return;
    this.model = m; this.prox = proximity; this.sr = sr;
    const spec = this.specs[clampf(m, 0, this.specs.length - 1)];
    this.count = 0; this.sat = spec[1]; this.satGain = spec[2];
    for (const [kind, freq, gain, q, px] of spec[0]) {
      const c = this.f[this.count].c;
      const g = px > 0 ? proximity * 9 * px : gain;
      switch (kind) {
        case 1: c.peak(freq, gain, q, sr); break;
        case 2: c.lowshelf(freq, g, q, sr); break;
        case 3: c.highshelf(freq, gain, q, sr); break;
        case 4: c.lowpass(freq, q, sr); break;
        default: c.highpass(freq, q, sr); break;
      }
      ++this.count;
    }
  }
  reset() { for (const b of this.f) b.reset(); }
  shape(x) {
    const drive = this.drive, sg = this.satGain;
    if (this.sat === 1) {
      const g = 1 + drive * 5 * sg, v = x * g + 0.08 * drive;
      return (Math.tanh(v) - Math.tanh(0.08 * drive)) / (0.6 + 0.4 * g) * (1 + 0.4 * drive);
    }
    if (this.sat === 2) { const g = 2 + drive * 14 * sg; return clampf(x * g, -0.7, 0.7) / (1 + drive * 3 * sg); }
    if (this.sat === 3) {

      const y = v > 0 ? Math.tanh(v) : Math.tanh(v * 0.6) / 0.6 * 0.8;
      return y / (0.7 + 0.3 * g) * 1.2;
    }
    if (drive > 0) { const g = 1 + drive * 3; return Math.tanh(x * g) / (0.7 + 0.3 * g); }
    return x;
  }
  process(Lb, Rb, n) {
    if (this.model <= 0) return;

      let l = Lb[i], r = Rb[i];
      for (let k = 0; k < cnt; ++k) { const b = f[k]; l = b.sl.tick(b.c, l); r = b.sr.tick(b.c, r); }
      Lb[i] = this.shape(l); Rb[i] = this.shape(r);
    }
  }
}

class MicModel {
  constructor() { this.colour = new ColourModel(MIC_SPECS); }
  update(m, proximity, d, sr) { this.colour.update(m, proximity, d, sr); }
  reset() { this.colour.reset(); }
  process(Lb, Rb, n) { this.colour.process(Lb, Rb, n); }
}

// Speaker models with a wet/dry mix. Rotary adds a spinning horn: moving delay and level between the channels.
class SpeakerModel {
  constructor() { this.colour = new ColourModel(SPK_SPECS); this.rot = [new DelayLine(), new DelayLine()]; this.phase = 0; this.sr = 48000; this.wetL = new Float32Array(64); this.wetR = new Float32Array(64); }
  prepare(sr) { this.sr = sr; this.rot[0].resize(Math.floor(sr * 0.01)); this.rot[1].resize(Math.floor(sr * 0.01)); this.reset(); }
  reset() { this.colour.reset(); this.rot[0].clear(); this.rot[1].clear(); this.phase = 0; }
  process(Lb, Rb, n, model, drive, mix) {
    if (model <= 0) return;
    const sr = this.sr, wl = this.wetL, wr = this.wetR;
    this.colour.update(model, 0, drive, sr);
    for (let pos = 0; pos < n; pos += 64) {
      const c = Math.min(64, n - pos);
      for (let i = 0; i < c; ++i) { wl[i] = Lb[pos + i]; wr[i] = Rb[pos + i]; }
      this.colour.process(wl, wr, c);
      if (model === 14) {
        const inc = 6.2 / sr;
        for (let i = 0; i < c; ++i) {
          this.phase += inc; if (this.phase >= 1) this.phase -= 1;
          const sn = Math.sin(kTwoPi * this.phase), co = Math.cos(kTwoPi * this.phase);
          this.rot[0].write(wl[i]); this.rot[1].write(wr[i]);
          wl[i] = this.rot[0].read(sr * (0.0022 + 0.0012 * sn)) * (0.75 + 0.25 * co);
          wr[i] = this.rot[1].read(sr * (0.0022 - 0.0012 * sn)) * (0.75 - 0.25 * co);
        }
      }
      for (let i = 0; i < c; ++i) { Lb[pos + i] += (wl[i] - Lb[pos + i]) * mix; Rb[pos + i] += (wr[i] - Rb[pos + i]) * mix; }
    }
  }
}

class PopTamer {
  constructor() { this.lp = new StereoBiquad(); this.envFast = 0; this.envSlow = 0; this.gain = 1; this.sr = 48000; this.cutoff = -1; }
  reset() { this.lp.reset(); this.envFast = this.envSlow = 0; this.gain = 1; }
  process(Lb, Rb, n, fc, sens, sr) {
    if (fc !== this.cutoff || sr !== this.sr) { this.cutoff = fc; this.sr = sr; this.lp.c.lowpass(fc, 0.707, sr); }

const MANUAL = [{"title": "1. Welcome", "sections": [{"title": "What Vecta Vocal is", "body": "Vecta Vocal is a vocal synthesiser by Dream Music Temple. It sings vowel sounds from four layers, each using its own kind of vocal synthesis, and sends them through a studio chain of microphone and speaker models, dynamics, an equaliser and creative effects that you can put in any order. An advanced arpeggiator and a Vectors pad that blends the four layers (with a tempo-synced movement recorder) are built in, and five interface designs are available in Settings.\n\nIt comes in three forms, all installed together:\n\u2022 The Vecta Vocal app, which plays on its own on iPhone, iPad and Mac.\n\u2022 Vecta Vocal, an Audio Unit (AUv3) instrument for hosts such as Logic Pro, GarageBand, AUM, Cubasis and Loopy Pro.\n\u2022 Vecta Vocal FX, an Audio Unit (AUv3) music effect. It takes audio from a track, passes it through the studio chain, and lets Vocoder layers sing with that audio while you play notes."}, {"title": "Quick start", "body": "1. Press a key on the on-screen keyboard, or play a MIDI keyboard.\n2. Step through sounds with the arrows either side of the preset name. Tap the name to open the preset browser.\n3. On the Voice page, drag the dot on the vowel pad to change the vowel.\n4. Turn any knob by dragging up or down on it. Double tap a knob to return it to its default. On a Mac you can also use the scroll wheel; with VoiceOver, swipe up or down."}, {"title": "The screen", "body": "The top bar holds the name, the preset selector, the five page tabs (Layers, Voice, Vectors, Studio, FX), the Hide keys button, the voice counter and the Settings button (gear). Hide keys hides the performance strip and keyboard to give the pages more room; press Show keys to bring them back.\n\nBelow the pages is the performance strip: pitch bend wheel, mod wheel, Latch, the per-layer bend switches, octave buttons and the keyboard. The keyboard button in the top bar shows or hides the strip.\n\nEvery page reflows to fit the window, from an iPhone held upright to a full Mac screen or a narrow window in a host."}]}, {"title": "2. Playing", "sections": [{"title": "Keyboard", "body": "Touch or click a key to play it. Slide across the keys to play a run. Playing lower on a key plays louder.\n\nThe \u2212 and + buttons move the keyboard down or up an octave; the note name between them shows the lowest C.\n\nThe keys show the current scale: keys in the scale carry a blue strip and the key note a pink strip. When Scale lock is set to Block, keys outside the scale are shaded with lines because they will not play."}, {"title": "Latch", "body": "With Latch on, notes keep sounding after you let go. Play a new chord and it replaces the held one. Switch Latch off to release everything you are no longer holding. Latch also works with notes from a MIDI controller or a host track."}, {"title": "Pitch bend wheel", "body": "Drag the Bend wheel up or down to bend the pitch; it springs back to the centre when you let go. The bend range is set by Bend on the Voice page (0 to 48 semitones).\n\nThe four small switches L1 to L4 under Latch choose which layers follow the wheel. For example, bend only layer 1 while layer 2 holds the original note. The same switch appears as Pitch bend in each layer's Pitch panel."}, {"title": "Mod wheel", "body": "The Mod wheel adds vibrato on top of the vibrato depth set on the Voice page. It stays where you leave it."}]}, {"title": "3. Layers page", "sections": [{"title": "Layer mixer", "body": "The four cards at the top are the layers. Each has an engine selector, an On switch and a Level knob. Tap the coloured tag (L1 to L4) or the card to edit that layer below. Each layer keeps its own colour on every page.\n\nEvery note you play sounds on every layer that is switched on, so four layers cost four times the processing of one."}, {"title": "Engines", "body": "\u2022 Formant: a glottal source through five vowel filters. Clear, light on the processor, the best starting point.\n\u2022 Articulatory: a physical model of the vocal tract as a tube whose shape follows the vowel pad. The most natural and the heaviest on the processor.\n\u2022 FOF Grain: short pulses ring a bank of formant resonators, the classic synthetic choir.\n\u2022 Vocoder: a saw or pulse carrier through a filter bank. Its voice comes from the vowel model, or from audio input (see Vocoder voice from)."}, {"title": "Shaping", "body": "Formant moves the vowel colour up or down without changing the note (\u00b112 semitones).\nThroat sets the size of the singer, from a child (0.5) to a giant (2.5).\nBreath adds air and aspiration.\nTense moves from a soft, dark voice to a pressed, bright one. Velocity and pressure also add tension.\nNasal adds a nasal resonance.\n\nThe two shape knobs change with the engine:\n\u2022 Formant: Resonance (how sharp the formants are) and Presence (energy in the upper formants).\n\u2022 Articulatory: Tongue (0 is a relaxed tube, 1 exaggerates the vowel shape) and Lip round.\n\u2022 FOF Grain: Skirt (softness of each pulse) and Grain decay.\n\u2022 Vocoder: Bands (6 to 24 filters) and Carrier (saw, then pulse, then added noise for consonant-like hiss).\n\nVocoder voice from (Vocoder engine only): Vowel model uses the vowel pad; Audio input uses the sound coming into Vecta Vocal FX, or Live input in the app; with no incoming audio it falls back to the vowel model. The keys still choose the notes."}, {"title": "Tone and envelope", "body": "Low cut and High cut filter the layer before it is mixed. Drive adds saturation. Pan places the layer left or right. Spread fans successive notes across the stereo field.\n\nAttack, Decay, Sustain and Release shape the loudness of each note from key press to after release."}, {"title": "Autotune", "body": "Each layer has its own Autotune switch. It pulls the pitch to the nearest note of the key and scale (set on the Voice page and shared by all layers).\nSpeed is how quickly it corrects: 0 ms gives the hard, stepped effect, especially with glide or pitch bend; 50 to 150 ms sounds natural.\nHumanise adds the small pitch drift of a real singer. With Autotune on, that drift is corrected at the chosen speed."}, {"title": "Pitch", "body": "Octave, Semitone and Fine transpose the layer. Pitch bend switches whether this layer follows the bend wheel and MIDI pitch bend."}, {"title": "Extra voices", "body": "Each layer has two voices above (Up 1, Up 2) and two below (Down 1, Down 2), sung by the same engine.\nOct and 5th set the interval to an octave or a fifth; press again for two octaves or an octave and a fifth. The interval knob sets any distance from 0 to 36 semitones. Fine detunes in cents for a thicker sound. Level sets the volume.\nWith Autotune on, the extra voices also snap to the scale, so they follow the key instead of staying strictly parallel."}]}, {"title": "4. Voice page", "sections": [{"title": "Vowel pad", "body": "Choose a layer with L1 to L4, then drag the dot. Left to right moves the tongue from front to back; top to bottom opens the mouth. I, E, A, O and U mark where those vowels sit, and the space between them blends smoothly. Each layer keeps its own vowel.\n\nFollow face (iPhone and iPad app only) lets this layer take its vowel from your mouth while face control runs."}, {"title": "Performance", "body": "Glide slides between notes. Vibrato has Rate, Depth and Delay (how long after the note starts the vibrato fades in). Bend sets the pitch bend range. Mono legato plays one note at a time and glides between overlapping notes."}, {"title": "Arpeggiator", "body": "Switch Arp on and hold some notes: the arpeggiator plays them one at a time, in time with the host's tempo (or the Tempo control when there is no host).\n\nMode sets the order: Up, Down, Up-Down, Down-Up, Up-Down Repeat (the top and bottom notes play twice), As Played (the order you pressed the keys), Random, Random Walk (moves one note up or down at random), Converge (outside notes first, moving inwards), Diverge (middle first, moving outwards), Thumb (the lowest note between every other note), Pinky (the highest note between every other note) and Chord (all held notes together).\n\nRate sets the note length, from whole notes to 1/32, including dotted (D) and triplet (T) values. Octaves spreads the pattern over 1 to 4 octaves, and Octave dir sets whether it climbs Up, Down, Up-Down or jumps to a Random octave on each note.\n\nGate is how long each note sounds, as a share of the step (over 100% the notes overlap). Swing delays every second step. Accent sets how much louder Accent steps are, and how much quieter the others.\n\nPattern: the 16 step buttons cycle On, Accent and Rest. Steps sets how many of them are used, so a pattern of 3, 5 or 7 steps drifts against the bar. The notes keep moving through the order on every played step.\n\nChance is the probability that a step plays at all. Repeat plays each note 1 to 4 times before moving on. Ratchet splits a step into 2 to 4 quick repeats, and Ratch % is how often that happens. Humanise moves notes slightly in time and level.\n\nLatch keeps the arpeggio running after you let go; the next chord you play replaces it. Scale lock still applies to the keys you hold. Everything is saved with the preset."}, {"title": "Key and scale", "body": "Key and Scale set the musical scale used by Autotune, the extra voices, Scale lock and the keyboard display.\n\nThere are 46 scales: modes (Ionian, Dorian, Phrygian, Lydian, Mixolydian, Aeolian, Locrian), melodic and harmonic minors and majors, pentatonics and blues, jazz scales (Lydian Dominant, Altered, Bebop, the two diminished scales, Whole Tone, Augmented), scales from around the world (Phrygian Dominant, Double Harmonic, Hungarian, Neapolitan, Persian, Enigmatic, Romanian, Spanish 8-Tone, Hirajoshi, In Sen, Iwato, Kumoi, Yo, Ryukyu, Pelog, Egyptian, Chinese), and simple sets (Major Triad, Minor Triad, Fifths Only).\n\nThe strip of twelve notes shows which notes belong to the scale, with the key note in pink.\n\nScale lock:\n\u2022 Off: every key plays.\n\u2022 Block: keys outside the scale do nothing. On the keyboard they are shaded.\n\u2022 Snap: keys outside the scale play the nearest scale note instead.\nScale lock applies to the on-screen keyboard, MIDI controllers and host tracks alike. A note always stops correctly, even if you change the scale while holding it."}, {"title": "Vowel sequence", "body": "Type vowels (A E I O U) and switch Sequence on. Each new note sings the next vowel, up to 32 steps. The sequence restarts after two seconds of silence and is saved with the preset."}, {"title": "Face control", "body": "Available in the iPhone and iPad app on devices with a TrueDepth (Face ID) camera. Press Start face control and allow camera access.\nOpening your jaw opens the vowel; puckering moves it toward O and U; smiling moves it toward E and I; raising your brows adds vibrato; tilting your head bends the pitch (on layers whose Pitch bend switch is on).\nOnly layers with Follow face switched on respond. The camera image is processed on the device, is never recorded and never leaves it. Face control stops automatically if the app goes to the background or the camera is interrupted; press Start again when you return."}]}, {"title": "5. Vectors page", "sections": [{"title": "Vector pad", "body": "The Vectors page blends the four layers with one finger. Switch Vectors on, then drag across the square pad. Each corner is one layer: L1 top left, L2 top right, L3 bottom left and L4 bottom right. In the centre all four are mixed evenly; at a corner only that layer sounds. The blend keeps the overall loudness steady as you move.\n\nThe ring shows your finger, and the lit dot shows the position the sound is using (it follows a recording while one plays). The four bars under the pad show how much of each layer you hear. The pad only mixes layers that are switched on, at the levels set on the Layers page. Vector X and Vector Y are host-automatable parameters.\n\nWith Vectors off, all layers play at their normal levels."}, {"title": "Recording movement", "body": "Choose a length (1, 4, 8 or 16 bars), press Record and move the pad. When the host is playing, recording waits for the next bar line (the button shows Armed) and then starts; in the standalone app it starts straight away. It stops by itself at the end of the chosen length and the movement starts looping, in time with the tempo. The recorded path is drawn on the pad.\n\nWhile the loop plays, moving the pad does not change the sound. Press Stop to play the pad by hand again, and Play to start the loop again. Clear deletes the recording. Pressing Record while armed or recording cancels it.\n\nThe loop is saved with presets and with host projects. Vector Quartet and Rotary Gospel in DMT CYMATICS come with recorded loops."}, {"title": "Tips", "body": "Give each corner a different engine and vowel for the biggest movement, for example Formant on Ah, Articulatory on U, FOF on I and a vocoder an octave down. Set long attack and release times so changes stay smooth. A 16-bar loop at a slow tempo makes an evolving pad; a 1-bar loop at a fast tempo makes a rhythmic vowel pulse."}]}, {"title": "6. Studio page", "sections": [{"title": "Equaliser and spectrum", "body": "The blue shape is the live output spectrum and the pink line is the equaliser curve. Drag a numbered handle left and right for frequency and up and down for gain, or use the knobs below.\nBand 1 is a low cut (Q sets its slope), bands 2 to 5 are bells, band 6 is a high shelf. The EQ switch bypasses all six bands."}, {"title": "Microphone model", "body": "Colours the signal like a microphone. Tube Condenser is warm with an airy top. Ribbon is dark and smooth. Broadcast Dynamic is tight and forward. FET Condenser is clean with a slight lift. Old Telephone is a narrow, distorted band. Classic Dynamic is the stage microphone sound with a presence peak. Small Condenser is bright and detailed. Vintage Crystal is thin with a fuzzy edge. Walkie-Talkie is a squashed radio band. Contact Piezo is hard and nasal. Tin Can rings with two sharp resonances. Lavalier is a clip-on microphone, slightly dull. Bullet is the harmonica microphone: mid-heavy and driven.\n\nProximity adds the bass lift of singing close to the microphone (on the models that have it). Drive adds the model's own saturation. Choose Off to bypass the microphone."}, {"title": "Speaker model", "body": "Plays the voice back through a speaker or cabinet: Studio Monitor, Guitar Cab, Hi-Fi, Tube Radio, Old TV, Pocket Radio, Laptop Speaker, Megaphone, Smartphone, PA Horn, Bass Cabinet, Jukebox, Intercom and Rotary (a spinning horn that swirls the sound between left and right).\n\nDrive pushes the speaker into distortion. Mix blends the speaker with the direct sound, so you can add a little radio colour without losing the body of the voice. Choose Off to bypass it. The Speaker has its own place in the signal chain on the FX page: by default after the equaliser and before the effects."}, {"title": "De-esser", "body": "Reduces harsh energy around Freq when it rises above Thresh. Range limits how far it can reduce. The GR meter shows the reduction as it happens."}, {"title": "Pop tamer", "body": "Holds back sudden low-frequency thumps from note starts and plosive sounds. Cutoff sets what counts as low; Sens sets how readily it acts."}, {"title": "Audio input", "body": "In the app, Live input plays your microphone or audio interface through the studio chain, and Vocoder layers set to Audio input sing with it. The first time, you are asked for microphone permission. Use headphones: if headphones are unplugged while Live input is on, it switches off to prevent feedback.\nIn Vecta Vocal FX, the audio comes from the host track.\nInput level sets how loud the input is in the mix. Turn it down to hear only the vocoder."}, {"title": "Output", "body": "Level meters, Master volume, and the Limiter, which keeps peaks under full scale. The limiter always runs last, after the whole chain."}]}, {"title": "7. FX page", "sections": [{"title": "Signal chain", "body": "The Signal chain panel lists the twelve processors in the order the sound passes through them. The default order is Microphone, Pop tamer, De-esser, Equaliser, Speaker, Chorus, Spectral, Granular, Glitch, Delay, Reverb and Haas. The four layers and any audio input enter at the start; the limiter is always last.\nEach module shows its On switch (the microphone is bypassed by choosing Off). Use the arrows to move a module earlier or later. Default order restores the original order. The order is saved with presets and with host projects.\nIdeas: Glitch after Delay cuts up the echoes; Granular before Reverb blurs the grains together; Chorus after Reverb widens the whole tail; the Equaliser last shapes everything."}, {"title": "Chorus", "body": "A two-mode ensemble chorus in the style of classic bucket-brigade synth choruses. Mode I is slow and wide, II is faster, I + II is a fast shimmer. Mix sets how much chorus is added."}, {"title": "Spectral", "body": "Works on the sound's frequency spectrum. Mode:\n\u2022 Blur smears the spectrum over time (Smear sets how long, up to 2 seconds).\n\u2022 Shift moves every partial up or down without changing speed (\u00b124 semitones; the centre is no shift).\n\u2022 Robot fixes the phases for a metallic, monotone voice.\n\u2022 Whisper randomises the phases for a breathy, unpitched voice.\n\u2022 Gate keeps only the strongest partials (Threshold).\nFreeze holds the current spectrum, in any mode, until you switch it off. Mix blends the processed and original sound. While switched on, Spectral adds 21 ms of delay to the whole sound."}, {"title": "Granular", "body": "Plays up to 32 short grains taken from the last three seconds of sound. Size is the grain length (10 to 500 ms), Density how many grains start each second, Pitch transposes every grain (\u00b124 semitones), Spray scatters grains in time and across the stereo field, Reverse is the chance of a grain playing backwards, and Mix blends the cloud with the original."}, {"title": "Glitch", "body": "On each beat division (Every: 1/4 to 1/32 note) a glitch may fire, with the probability set by Chance: a stutter repeat of the last slice, a reverse, a tape stop, or a rhythmic gate chop. Crush lowers the bit depth and sample rate. Glitch follows the host tempo; in the app it runs at 120 BPM."}, {"title": "Haas", "body": "Delays the right channel by up to 40 ms (Width) so the sound spreads wide. Keep it under about 15 ms if the mix may be heard in mono."}, {"title": "Delay", "body": "Tape wobbles and saturates. Ping-pong bounces between left and right. Bucket is dark and gritty. Formant passes each echo through a moving vowel. Set Sync to a note value to follow the host tempo, or leave it on Free and use Time. Feedback sets how many repeats; Tone darkens them."}, {"title": "Reverb", "body": "Plate, Chamber, Hall, Spring, Shimmer (adds an octave above the tail) and Cathedral. Pre-delay separates the voice from the tail, Decay is its length, Size the room, and Damping darkens it."}]}, {"title": "8. Presets", "sections": [{"title": "Banks", "body": "Tap the preset name to open the browser. User Artist holds your own presets; DMT CYMATICS holds the 26 factory presets. Use the arrows beside the name to step through the current bank."}, {"title": "Saving and editing", "body": "\u2022 Load plays the selected preset.\n\u2022 Save current sound as new stores everything in User Artist under the name and notes you typed.\n\u2022 Save name and notes renames a preset and stores its notes without changing its sound.\n\u2022 Overwrite with current sound replaces the selected preset's settings with what you hear now.\n\u2022 Copy to User Artist makes an editable copy of any preset.\n\u2022 Delete removes a user preset. Restore original undoes your changes to a DMT CYMATICS preset.\nA preset stores every control on every page, the vowel sequence, the signal chain order, the name and the notes."}, {"title": "In a host", "body": "Hosts save the complete state with your project, including the chain order, quality and polyphony, so the project sounds the same when reopened. The factory presets also appear in the host's own preset menu, and hosts that support user presets can save them there too.\nOn iPhone and iPad, the app and the plug-ins share one User Artist library. On the Mac they keep separate libraries."}]}, {"title": "9. Settings", "sections": [{"title": "Sound quality", "body": "Quality sets how often pitch, vowel shape and filters are recalculated: every 64 samples on Eco, 32 on Standard, 16 on High and 8 on Ultra. Higher settings make fast vowel and pitch movement smoother. Eco also runs the Articulatory engine at the host sample rate instead of twice the rate, roughly halving its processor use.\nPolyphony sets how many notes can sound at once, from 1 to 16. When you play more, the oldest released note is reused first.\nIn a host, quality and polyphony are saved with the project."}, {"title": "Interface design", "body": "Choose one of five looks. Each has its own colours, panels and knobs; the sound is not affected.\n\n\u2022 Midnight Neon: the original dark design with cyan, magenta, lime and amber lights.\n\u2022 Metal Hardware: brushed gunmetal panels, chrome knobs and orange indicator lamps.\n\u2022 Green Nature: moss and bark colours, wooden knobs and leaf-green lights.\n\u2022 Japanese Manga Robot: navy armour plating, bold outlines, octagonal knobs with hazard rings, yellow and red signals.\n\u2022 Snow: a light design with frosted white panels, porcelain knobs and ice-blue lights.\n\nThe four layer colours follow the design. The choice is remembered on the device; the app and each plug-in window keep their own."}, {"title": "Display", "body": "Turn the spectrum analyser and the performance strip on or off."}, {"title": "MIDI", "body": "Vecta Vocal responds to notes and velocity on every channel; pitch bend per channel; the mod wheel (CC 1, vibrato); channel and poly pressure and CC 74 (brightness); the sustain pedal (CC 64); and All Notes Off (CC 120 and 123). Because bend and pressure are tracked per channel, MPE controllers work without extra setup.\nIn a host, every control is published as an automatable parameter. The app listens to every connected MIDI source, including USB, Bluetooth and network MIDI set up in the system."}]}, {"title": "10. Using the plug-ins", "sections": [{"title": "Vecta Vocal (instrument)", "body": "Load it on an instrument or MIDI track. It has no audio input. The interface resizes to whatever window the host gives it."}, {"title": "Vecta Vocal FX (effect)", "body": "Load it on an audio track or as an insert. In Logic Pro it appears under Audio Units \u203a Dream Music Temple; in AUM, Cubasis and Loopy Pro under effects. Route MIDI to it from a keyboard or a MIDI track to play the layers.\nWith no notes playing, the track's audio passes through the studio chain, so it works as a vocal channel strip with creative effects. Set a Vocoder layer to Audio input to sing chords with the incoming audio; Live Vocoder in DMT CYMATICS is set up for this."}, {"title": "Tempo", "body": "In a host, everything that keeps time follows the host: the arpeggiator, the vector recorder, delay sync and Glitch. The arpeggiator and vector recordings line up with the host's beats and bars while the transport plays. The Tempo control shows \"Synced to host\" with the host's tempo.\n\nIn the standalone app there is no host, so Vecta Vocal keeps its own time at the Tempo control (40 to 300 BPM), found on the Voice, Vectors and FX pages. Tempo is saved with the preset."}]}, {"title": "11. Performance and troubleshooting", "sections": [{"title": "Processor use", "body": "Processor use grows with notes \u00d7 layers switched on \u00d7 extra voices. The Articulatory engine is the heaviest, Formant the lightest; Spectral and Granular are the heaviest effects. If you hear crackles: lower Polyphony, switch off unused layers or effects, choose Eco, or raise the host's buffer size."}, {"title": "Interruptions", "body": "Phone calls, alarms and other apps can interrupt audio. Vecta Vocal stops held notes when an interruption starts and restarts its audio when it ends. Plugging or unplugging headphones or Bluetooth audio rebuilds the audio connection automatically."}, {"title": "Common questions", "body": "No sound: check that at least one layer is On, Master is up, the device volume is up, and Scale lock is not set to Block for the keys you are playing.\nNotes keep sounding: switch Latch off, release the sustain pedal, or send All Notes Off from the host.\nA Vocoder layer set to Audio input sounds like the other vowel layers: when there is no incoming audio (Vecta Vocal FX or Live input), it falls back to the vowel model.\nClicks when moving Throat on the Articulatory engine: the tube length changes in steps, so set it before playing or automate it slowly.\nLive input switched itself off: headphones were disconnected, which would cause feedback through the speaker."}]}, {"title": "12. Privacy", "sections": [{"title": "Camera, microphone and data", "body": "Vecta Vocal does not collect, store or send any personal data. The camera (face control) and microphone (live input) are used only while you switch those features on; the images and sound are processed on the device and are never recorded or sent anywhere. Presets and settings are stored on your device."}]}, {"title": "13. Credits", "sections": [{"title": "Dream Music Temple", "body": "Vecta Vocal is designed, developed and published by Dream Music Temple. Factory presets by DMT CYMATICS."}]}, {"title": "14. About this web version", "sections": [{"title": "What it is", "body": "This page is a test version of Vecta Vocal for trying the sound and the controls in a browser before the native app is built. It runs the same engine, ported line for line from the C++ code, with the same presets, pages and settings."}, {"title": "Differences from the app", "body": "\u2022 Presets are kept in this browser. Use Export User Artist in the preset browser to back them up, and Import to load them on another device.\n\u2022 MIDI controllers work in Chrome and Edge (Web MIDI). Safari has no Web MIDI, so use the on-screen keys or the computer keys A W S E D F T G Y H U J K O L P and ; with Z and X to change octave.\n\u2022 There is no host, so the arpeggiator, vector recorder, delay sync and Glitch follow the Tempo control (on the Voice, Vectors and FX pages).\n\u2022 Live input uses the browser's microphone permission.\n\u2022 Face control uses the camera through Google's MediaPipe face model, loaded from the internet the first time. It is experimental here and works on most devices with a front camera.\n\u2022 Audio latency in a browser is higher than in the native app."}]}];
const BUILD_DATE = "2026-10-16";
</script>
<script>
// Vecta Vocal - web test version: interface, presets, MIDI, keyboard, face control.
// Dream Music Temple. Mirrors the SwiftUI interface in Shared/.
'use strict';

const DSP_SOURCE = document.getElementById('dsp-src').textContent;
const DSP = new Function(DSP_SOURCE + '\nreturn { paramTable, BiquadCoef, designEqBand, SCALES, scaleMask, M, CHAIN_NAMES, DEFAULT_CHAIN };')();
// Colours come from the active interface design (CSS variables), so every control follows a theme change.
const C = { cyan: 'var(--cyan)', magenta: 'var(--magenta)', lime: 'var(--lime)', amber: 'var(--amber)' };
const LAYER_COLORS = [C.cyan, C.magenta, C.lime, C.amber];
// Canvas drawing needs real colour values: read the variable from the page.
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888'; }
const THEMES = [
  { id: 'neon', title: 'Midnight Neon', blurb: 'Dark panels with cyan, magenta, lime and amber lights. The original look.' },
  { id: 'metal', title: 'Metal Hardware', blurb: 'Brushed gunmetal, chrome knobs and orange indicator lamps, like rack hardware.' },
  { id: 'nature', title: 'Green Nature', blurb: 'Moss and bark tones, wooden knobs and leaf-green lights.' },
  { id: 'mecha', title: 'Japanese Manga Robot', blurb: 'Navy armour plating, bold outlines, octagonal knobs with hazard rings, red and yellow signals.' },
  { id: 'snow', title: 'Snow', blurb: 'A light theme: frosted white panels, porcelain knobs and ice-blue lights.' },
];
const BANK_USER = 'User Artist', BANK_FACTORY = 'DMT CYMATICS';
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } },
};

// ---------------------------------------------------------------- tiny DOM helper

function h(tag, attrs, ...children) {
  const el = document.createElementNS(tag === 'svg' || attrs?.svg ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'svg' || v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') {
      for (const [prop, val] of Object.entries(v)) {
        if (val === undefined || val === null) continue;
        if (prop.startsWith('--')) el.style.setProperty(prop, val); else el.style[prop] = val;
      }
    }
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const $ = (id) => document.getElementById(id);
function toast(message) {
  const t = $('toast'); t.textContent = message; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------------------------------------------------------------- parameters

const P = {};
for (const info of DSP.paramTable) P[info.identifier] = { info, value: info.def, subs: [] };
let node = null, ctx = null, analyser = null;
const post = (msg) => { if (node) node.port.postMessage(msg); };

const isLog = (info) => (info.unit === 3 || info.unit === 5 || info.unit === 6) && info.min > 0;
const COUNTS = new Set(['arp_octaves', 'arp_steps', 'arp_ratchet', 'arp_repeat', 'tempo']);
const isStepped = (info) => info.unit === 1 || info.unit === 2 || info.identifier.endsWith('_semi') || info.identifier.endsWith('octave') || info.identifier === 'bend_range' || COUNTS.has(info.identifier);
function setP(id, v, send = true) {
  const p = P[id];
  if (!p) { console.warn('unknown parameter', id); return; }
  v = Math.min(p.info.max, Math.max(p.info.min, Number(v)));
  if (isStepped(p.info)) v = Math.round(v);
  if (!(v === v)) return;
  if (v === p.value && !send) return;
  p.value = v;
  for (const f of p.subs) f(v);
  if (send) post({ type: 'param', address: p.info.address, value: v });
  saveSessionSoon();
}
function sub(id, fn) { P[id].subs.push(fn); fn(P[id].value); }
function norm(id) {
  const { info, value } = P[id];
  if (isLog(info)) return Math.log(value / info.min) / Math.log(info.max / info.min);
  return (value - info.min) / (info.max - info.min);
}
function setNorm(id, n) {
  const { info } = P[id]; n = Math.min(1, Math.max(0, n));
  setP(id, isLog(info) ? info.min * Math.pow(info.max / info.min, n) : info.min + n * (info.max - info.min));
}
function display(id) {
  const { info, value: v } = P[id];
  switch (info.unit) {
    case 1: return v > 0.5 ? 'On' : 'Off';
    case 2: return info.labels[Math.round(v)] ?? String(Math.round(v));
    case 3: return v >= 1000 ? (v / 1000).toFixed(1) + ' kHz' : v.toFixed(0) + ' Hz';
    case 4: return (v >= 0 ? '+' : '') + v.toFixed(1) + ' dB';
    case 5: return v >= 1000 ? (v / 1000).toFixed(2) + ' s' : v.toFixed(0) + ' ms';
    case 6: return v.toFixed(1) + ' s';
    case 7: return (v * 100).toFixed(0) + '%';
    case 8: return (v >= 0 ? '+' : '') + (isStepped(info) ? v.toFixed(0) : v.toFixed(1)) + ' st';
    case 9: return (v >= 0 ? '+' : '') + v.toFixed(0) + ' c';
    default:
      if (info.identifier === 'tempo') return v.toFixed(0) + ' BPM';
      if (COUNTS.has(info.identifier)) return v.toFixed(0);
      return isStepped(info) ? (v >= 0 ? '+' : '') + v.toFixed(0) : v.toFixed(2);
  }
}
const lid = (layer, name) => 'l' + (layer + 1) + '_' + name;
function sendAllParams() {
  post({ type: 'params', values: Object.values(P).map((p) => [p.info.address, p.value]) });
}

// ---------------------------------------------------------------- controls

// Hardware knob: printed scale with 31 notches (lit up to the value, from the centre on bipolar knobs), a body and a
// pointer. Each interface design has its own body and pointer, drawn once in <svg id="knob-defs"> and shown by CSS.
const KNOB_STYLES = ['machined', 'chrome', 'wood', 'mecha', 'porcelain'];
function knob(id, label, color = C.cyan, small = false, format = null) {

// Face control in the browser uses MediaPipe Face Landmarker, loaded only when started.
class FaceControl {
  constructor() {

    this.meters = {};

    this.video = h('video', { class: 'face-preview', playsinline: true, muted: true, autoplay: true, 'aria-label': 'Camera preview' });
    this.video.style.display = 'none';
    this.btn = button('Start face control', () => (this.running ? this.stop() : this.start()), { color: C.magenta, filled: true });
    this.btn.style.setProperty('--accent', C.magenta);
    this.status = note('Uses the front camera. Video is processed in this browser tab, is never recorded and is not uploaded. Needs an internet connection the first time to load the face model.');
    this.panel = panel('Face control', { accent: C.magenta },
      row(this.btn, this.video),
      ...rows.map(([k, name, target]) => {
        const bar = h('i', { style: { background: C.magenta } });
        this.meters[k] = bar;
        return h('div', { class: 'meter-row' }, h('span', { class: 'name' }, name), h('span', { class: 'meter' }, bar), h('span', { class: 'num', style: { color: 'var(--dim)', width: '84px' } }, target));
      }),
      this.status,
      note('Layers with Follow face switched on take their vowel from your mouth while tracking runs. Experimental in the web version.'));
  }
  async start() {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) { toast('Face control needs a secure (https) page and camera access.'); return; }
    this.btn.textContent = 'Loading…';
    try {
      if (!this.landmarker) {
        const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
        const vision = await import(base + '/vision_bundle.mjs');
        const files = await vision.FilesetResolver.forVisionTasks(base + '/wasm');
        this.landmarker = await vision.FaceLandmarker.createFromOptions(files, {
          baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
          outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true, runningMode: 'VIDEO', numFaces: 1,
        });

      this.video.srcObject = this.stream; this.video.style.display = '';
      await this.video.play();
      this.running = true; this.btn.textContent = 'Stop face control'; this.btn.classList.remove('filled');
      this.panel.setTrailing('TRACKING');
      this.loop();
    } catch (err) {
      console.error(err);
      this.btn.textContent = 'Start face control';
      toast('Face control could not start: ' + (err.message || err));
    }
  }
  loop() {
    if (!this.running) return;
    const t = performance.now();
    if (this.video.readyState >= 2 && t !== this.lastTime) {
      this.lastTime = t;
      const res = this.landmarker.detectForVideo(this.video, t);
      const shapes = res.faceBlendshapes?.[0]?.categories;
      if (shapes) {
        const get = (n) => shapes.find((c) => c.categoryName === n)?.score ?? 0;
        const m = res.facialTransformationMatrixes?.[0]?.data;
        const roll = m ? Math.atan2(m[1], m[0]) : 0;
        const v = { jaw: get('jawOpen'), pucker: get('mouthPucker'), smile: (get('mouthSmileLeft') + get('mouthSmileRight')) / 2, brow: get('browInnerUp'), tilt: Math.max(-1, Math.min(1, -roll / 0.5)) };
        this.values = v;

        for (const k in v) this.meters[k].style.width = (Math.min(1, Math.abs(v[k])) * 100) + '%';
      }
    }
    requestAnimationFrame(() => this.loop());
  }
  stop() {
    this.running = false;
    if (this.stream) for (const tr of this.stream.getTracks()) tr.stop();
    this.video.style.display = 'none'; this.btn.textContent = 'Start face control'; this.btn.classList.add('filled');
    this.panel.setTrailing('');
    post({ type: 'face', jaw: 0, pucker: 0, smile: 0, brow: 0, tilt: 0, active: false });

  }
}

const LOW_HZ = 30, HIGH_HZ = 20000, RANGE_DB = 18;

    dragBand = best;
