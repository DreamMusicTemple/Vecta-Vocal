      onclick: () => { settings.theme = t.id; saveSettings(); applySettings(); for (const c of box.children) c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); } },
      probe, h('span', null, h('b', null, t.title), h('small', null, t.blurb)));
    box.append(b);
  }
  return box;
}
function openSettings() { renderSettings(); $('settingsSheet').classList.add('open'); }
// The user manual: chapter headings open to section headings, which open to the text.
function manualContents() {
  const all = [];
  const chapters = MANUAL.map((c) => {
    const d = h('details', { class: 'man-chapter' }, h('summary', null, c.title),
      c.sections.map((sct) => { const sd = h('details', { class: 'man-section' }, h('summary', null, sct.title), h('p', null, sct.body)); all.push(sd); return sd; }));
    all.push(d); return d;
  });
  return h('div', { class: 'manual' },
    row(button('Expand all', () => all.forEach((d) => { d.open = true; })), button('Collapse all', () => all.forEach((d) => { d.open = false; }))),
    chapters);
}
function renderSettings() {
  const body = $('settingsBody'); body.textContent = '';
  const line = (a, b) => h('div', { class: 'line' }, h('span', null, a), h('span', null, b));
  const qSel = h('select', { 'aria-label': 'Quality', onchange: (e) => { settings.quality = Number(e.target.value); saveSettings(); applySettings(); } },
    ['Eco', 'Standard', 'High', 'Ultra'].map((n, i) => h('option', { value: i, selected: settings.quality === i }, n)));
  const polyNum = h('span', null, settings.polyphony + ' notes');
  const poly = h('span', { class: 'row' }, button('−', () => { settings.polyphony = Math.max(1, settings.polyphony - 1); polyNum.textContent = settings.polyphony + ' notes'; saveSettings(); applySettings(); }, { small: true }), polyNum,
    button('+', () => { settings.polyphony = Math.min(16, settings.polyphony + 1); polyNum.textContent = settings.polyphony + ' notes'; saveSettings(); applySettings(); }, { small: true }));
  const toggle = (key, label) => h('div', { class: 'line' }, h('span', null, label),
    h('button', { class: 'pill', 'aria-pressed': settings[key] ? 'true' : 'false', onclick: (e) => { settings[key] = !settings[key]; e.currentTarget.setAttribute('aria-pressed', settings[key] ? 'true' : 'false'); saveSettings(); applySettings(); } }, h('i', { class: 'led' }), 'On'));
  body.append(h('div', { class: 'settings' },
    h('section', null, h('h3', null, 'Sound quality'),
      h('div', { class: 'line' }, h('span', null, 'Quality'), h('label', { class: 'select' }, qSel)),
      h('div', { class: 'line' }, h('span', null, 'Polyphony'), poly),
      note('Higher quality updates pitch, vowel shape and filters more often: every 64 samples on Eco, 32 on Standard, 16 on High and 8 on Ultra. Eco also runs the Articulatory engine at the device sample rate instead of twice the rate. Lower the polyphony if you hear crackles. Each note plays every layer that is switched on.')),
    h('section', null, h('h3', null, 'Audio input'), h('div', { class: 'line' }, h('span', null, 'Live input'), liveInputButton()),
      note('Plays your microphone or audio interface through the studio chain, and lets Vocoder layers set to Audio input sing with it. Use headphones to avoid feedback.')),
    h('section', null, h('h3', null, 'Interface design'), themePicker(), note('Each design has its own colours, panels and knobs. The choice is remembered in this browser.')),
    h('section', null, h('h3', null, 'Display'), toggle('analyser', 'Spectrum analyser'), toggle('keyboard', 'Performance strip and keyboard')),
    h('section', null, h('h3', null, 'MIDI'),
      line('Status', midiStatus), line('Notes', 'All channels, velocity sensitive'), line('Pitch bend', 'Per channel (MPE ready)'),
      line('Mod wheel (CC 1)', 'Vibrato depth'), line('Pressure and CC 74', 'Brightness'), line('Sustain (CC 64)', 'Hold notes'),
      line('Computer keys', 'A W S E D F T G Y H U J K O L P ;  ·  Z X octave')),
    h('section', null, h('h3', null, 'User Manual'), manualContents()),
    h('section', null, h('h3', null, 'About'), line('Product', 'Vecta Vocal'), line('Developer', 'Dream Music Temple'), line('Factory presets', 'DMT CYMATICS'),
      line('Version', 'Web test build ' + BUILD_DATE), line('Plug-in formats', 'AUv3 instrument and effect (native app)'), line('Audio', ctx ? ctx.sampleRate + ' Hz' : 'Not started'))));
}

// Live input: the microphone or audio interface, fed into the worklet's input.
const live = { on: false, stream: null, source: null, buttons: [] };
function liveInputButton() {
  const b = h('button', { class: 'pill', style: { '--accent': C.lime, minWidth: '120px' }, 'aria-pressed': live.on ? 'true' : 'false', onclick: () => setLiveInput(!live.on) },
    h('i', { class: 'led' }), 'Live input');
  live.buttons.push(b);
  return b;
}
async function setLiveInput(on) {
  if (on && !node) { toast('Start audio first.'); return; }
  if (on) {
    if (!navigator.mediaDevices?.getUserMedia) { toast('Audio input needs a secure (https) page in a current browser.'); return; }
    try {
      live.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      live.source = ctx.createMediaStreamSource(live.stream);
      live.source.connect(node);
      live.on = true;
      toast('Live input on. Use headphones to avoid feedback.');
    } catch (err) { toast('Live input could not start: ' + (err.message || err)); live.on = false; }
  } else {
    if (live.source) live.source.disconnect();
    if (live.stream) for (const t of live.stream.getTracks()) t.stop();
    live.source = null; live.stream = null; live.on = false;
  }
  live.buttons = live.buttons.filter((b) => b.isConnected);
  for (const b of live.buttons) b.setAttribute('aria-pressed', live.on ? 'true' : 'false');
}

// ---------------------------------------------------------------- start-up

function showPage(name) {
  for (const p of ['layers', 'voice', 'vectors', 'studio', 'fx']) {
    $('page-' + p).classList.toggle('active', p === name);
    $('tab-' + p).setAttribute('aria-selected', p === name ? 'true' : 'false');
  }
  store.set('vv.page', name);
}
function buildUI() {
  applyTheme();
  buildLayers(); buildVoice(); buildVectors(); buildStudio(); buildFX();
  selectLayer(0);
  for (const p of ['layers', 'voice', 'vectors', 'studio', 'fx']) $('tab-' + p).onclick = () => showPage(p);
  showPage(store.get('vv.page', 'layers'));
  $('prevPreset').onclick = () => stepPreset(-1); $('nextPreset').onclick = () => stepPreset(1);
  $('presetBtn').onclick = openPresets; $('settingsBtn').onclick = openSettings;
  $('kbdBtn').onclick = () => { settings.keyboard = !settings.keyboard; saveSettings(); applySettings(); };
  for (const id of ['presetSheet', 'settingsSheet']) {
    $(id).addEventListener('click', (e) => { if (e.target.id === id) $(id).classList.remove('open'); });
  }
  $('presetDone').onclick = () => $('presetSheet').classList.remove('open');
  $('settingsDone').onclick = () => $('settingsSheet').classList.remove('open');
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('presetSheet').classList.remove('open'); $('settingsSheet').classList.remove('open'); } });
  setupKeyboard();
  const session = store.get('vv.session', null);
  if (session && session.values) { applyValues(session.values, session.vowelSequence ?? 'A E I O U', session.chainOrder, session.vectorPath); currentPreset = session.preset || currentPreset; }
  else loadPreset(FACTORY_PRESETS[0]);
  if (seqInputEl) seqInputEl.value = vowelSequence;
  updatePresetName();
  requestAnimationFrame(drawAnalyser);
}

async function startAudio() {
  const btn = $('startBtn'); btn.disabled = true; btn.textContent = 'Starting…';
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    if (!ctx.audioWorklet) throw new Error('This browser does not support AudioWorklet. Use a current Safari, Chrome, Edge or Firefox.');
    const url = URL.createObjectURL(new Blob([DSP_SOURCE], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, 'vecta-vocal', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
    analyser = ctx.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.6;
    node.connect(analyser); analyser.connect(ctx.destination);
    node.port.onmessage = (e) => { if (e.data.type === 'meters') onMeters(e.data); else if (e.data.type === 'vectorPath') onVectorPath(e.data); };
    // iPhone and iPad: playing a silent media element lets Web Audio sound even with the ring/silent switch on.
    try { const a = $('unmute'); a.loop = true; await a.play(); } catch (e) { /* not needed elsewhere */ }
    await ctx.resume();
    sendAllParams(); setSequence(vowelSequence); applySettings(); post({ type: 'chain', value: chain });
    if (vec.path) post({ type: 'vectorPath', xy: vec.path.xy, lengthBeats: vec.path.lengthBeats, play: vec.path.playing });
    $('start').remove();
    setupMIDI();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx.state !== 'running') ctx.resume(); });
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = 'Try again';
    $('startNote').textContent = 'Audio could not start: ' + (err.message || err);
  }
}

buildUI();
$('startBtn').onclick = startAudio;
