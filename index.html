<style>
:root {
  --bg: #0A0B0F; --bar: #0E1016; --panel: #12141B; --well: #0A0B0F; --control: #1B1F2A; --border: #232733; --track: #2A2F3D;
  --text: #E8ECF4; --dim: #8A93A6; --cyan: #22E4FF; --magenta: #FF3DA6; --lime: #B6FF3C; --amber: #FFB020; --on-accent: #06222A;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
body { display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; background: var(--bar); border-bottom: 1px solid var(--border); flex: none; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .15em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.badge { font: 10px var(--mono); color: var(--cyan); border: 1px solid var(--cyan); border-radius: 3px; padding: 1px 4px; letter-spacing: 0; }
.preset-stepper { display: flex; align-items: center; gap: 2px; }
.icon-btn { width: 44px; height: 40px; border: 0; background: none; display: grid; place-items: center; border-radius: 6px; color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.active { color: var(--cyan); }
.preset-name { min-width: 180px; max-width: 260px; min-height: 40px; padding: 2px 12px; background: var(--control); border: 1px solid var(--track); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.preset-name b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.preset-name small { font-size: 8px; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
.tabs { display: flex; gap: 4px; }
.tab { min-height: 40px; padding: 0 14px; border: 0; border-radius: 6px; background: none; color: rgba(232,236,244,.75); font-weight: 700; font-size: 12px; letter-spacing: .1em; }
.tab[aria-selected="true"] { background: var(--cyan); color: var(--on-accent); }
.spacer { flex: 1; }
.status { font: 11px var(--mono); color: var(--dim); white-space: nowrap; }

/* pages */
main { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
.page { display: none; }
.page.active { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 8px; align-items: start; }
.grid.mixer { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); margin-bottom: 10px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel-title { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.panel-trailing { font: 10px var(--mono); color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.note { font-size: 11px; color: var(--dim); line-height: 1.4; margin: 0; }
.wide { grid-column: 1 / -1; }

/* knob */
.knob { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none; cursor: ns-resize; }
.knob svg { width: 48px; height: 48px; overflow: visible; }
.knob .track { fill: none; stroke: var(--track); stroke-width: 4; stroke-linecap: round; }
.knob .value-arc { fill: none; stroke-width: 4; stroke-linecap: round; }
.knob .val { font: 10px var(--mono); white-space: nowrap; max-width: 62px; overflow: hidden; text-overflow: ellipsis; }
.knob .lbl { font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; max-width: 62px; overflow: hidden; text-overflow: ellipsis; }
.knob.small { width: 54px; }
.knob.small svg { width: 40px; height: 40px; }

/* pill and buttons */
.pill { min-height: 36px; min-width: 64px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--track); background: var(--control); color: rgba(232,236,244,.8); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.pill[aria-pressed="true"] { background: var(--accent, var(--cyan)); border-color: var(--accent, var(--cyan)); color: var(--on-accent); }
.btn { min-height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--track); background: var(--control); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.btn.filled { background: var(--accent, var(--cyan)); border-color: var(--accent, var(--cyan)); color: var(--on-accent); }
.btn.small { min-height: 30px; padding: 0 8px; font-size: 10px; }
.select { display: flex; flex-direction: column; gap: 2px; }
.select span { font-size: 8px; font-weight: 600; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.select select { min-height: 44px; min-width: 84px; padding: 0 28px 0 10px; background: var(--well); color: var(--accent, var(--cyan)); border: 1px solid var(--accent, var(--cyan)); border-radius: 6px; font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 19px, calc(100% - 10px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }

/* layer cards */
.layer-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 10px; }
.layer-card.selected { border: 2px solid var(--accent); padding: 9px; }
.layer-tag { width: 40px; height: 44px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font: 600 13px var(--mono); flex: none; }
.layer-card .stack { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.layer-card .stack select { width: 100%; }
.voice-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.voice-row .quick { display: flex; flex-direction: column; gap: 4px; }

/* vowel pad, meters, canvases */
.pad { position: relative; height: 250px; background: var(--well); border-radius: 6px; touch-action: none; cursor: crosshair; }
.pad svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.layer-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.layer-pick button { min-height: 40px; border: 0; border-radius: 6px; background: var(--control); color: var(--accent); font: 600 12px var(--mono); }
.layer-pick button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.meter { height: 8px; border-radius: 4px; background: var(--well); overflow: hidden; flex: 1; }
.meter i { display: block; height: 100%; width: 0; background: var(--lime); border-radius: 4px; }
.meter.rev { display: flex; justify-content: flex-end; }
.meter-row { display: flex; align-items: center; gap: 8px; font: 10px var(--mono); }
.meter-row .name { width: 84px; font: 600 12px var(--sans); }
.meter-row .num { width: 64px; text-align: right; }
canvas.analyser { width: 100%; height: 220px; display: block; background: var(--well); border-radius: 6px; touch-action: none; }
.bands { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.band { background: rgba(27,31,42,.6); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.band .panel-title { color: var(--magenta); }
.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11px; color: rgba(232,236,244,.75); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
textarea, input[type="text"] { width: 100%; background: var(--well); border: 1px solid var(--track); border-radius: 6px; padding: 10px; color: var(--text); -webkit-user-select: text; user-select: text; }
input.seq { font: 600 16px var(--mono); min-height: 44px; }
video.face-preview { width: 160px; height: 120px; object-fit: cover; transform: scaleX(-1); border-radius: 6px; background: var(--well); }

/* keyboard */
.keyboard-wrap { flex: none; display: flex; gap: 8px; padding: 0 12px 10px; height: 114px; }
.keyboard-wrap.hidden { display: none; }
.oct { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 11px var(--mono); color: var(--dim); }
.oct button { width: 44px; height: 34px; border: 0; border-radius: 6px; background: var(--control); font-weight: 700; }
.keys { position: relative; flex: 1; touch-action: none; }
.keys .white { position: absolute; top: 0; bottom: 0; background: #DBDEE5; border-radius: 0 0 4px 4px; border: 1px solid var(--bg); }
.keys .black { position: absolute; top: 0; height: 58%; background: var(--bg); border: 1px solid var(--track); border-top: 0; border-radius: 0 0 3px 3px; z-index: 1; }
.keys .down { background: var(--cyan) !important; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(5,6,8,.82); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.overlay.open { display: flex; }
.sheet { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bar); border-bottom: 1px solid var(--border); }
.sheet-head h2 { margin: 0; font-size: 14px; letter-spacing: .15em; flex: 1; }
.sheet-body { padding: 12px; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 12px; }
.sheet-body.single { display: block; }
@media (max-width: 700px) { .sheet-body { grid-template-columns: 1fr; } }
.bank-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.bank-tabs button { min-height: 40px; border: 0; border-radius: 6px; background: var(--control); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.bank-tabs button[aria-pressed="true"] { background: var(--cyan); color: var(--on-accent); }
.preset-list { display: flex; flex-direction: column; gap: 4px; max-height: 52vh; overflow-y: auto; }
.preset-item { min-height: 44px; padding: 4px 10px; text-align: left; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; justify-content: center; }
.preset-item b { font-size: 14px; }
.preset-item small { font-size: 9px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
.preset-item[aria-selected="true"] { background: var(--control); border-color: var(--cyan); }
.preset-item .playing { color: var(--cyan); }
.field-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; color: var(--dim); margin: 6px 0 4px; }
.settings section { margin-bottom: 18px; }
.settings h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
.settings .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 14px; }
.settings .line:first-of-type { border-radius: 8px 8px 0 0; }
.settings .line:last-of-type { border-radius: 0 0 8px 8px; border-bottom: 0; }
.settings .line span:last-child { color: var(--dim); text-align: right; }
.manual h4 { color: var(--cyan); margin: 18px 0 6px; font-size: 17px; }
.manual p { white-space: pre-line; font-size: 14px; line-height: 1.5; margin: 0; -webkit-user-select: text; user-select: text; }
.start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); text-align: center; padding: 24px; }
.start h1 { margin: 0; letter-spacing: .25em; font-size: 26px; }
.start p { margin: 0; color: var(--dim); max-width: 420px; line-height: 1.5; }
.start .btn { min-height: 52px; padding: 0 28px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--control); border: 1px solid var(--track); border-radius: 8px; padding: 10px 16px; font-size: 13px; z-index: 30; display: none; max-width: 90vw; }
.toast.show { display: block; }

</style>

</div>

  <div class="brand">VECTA VOCAL <span class="badge">WEB TEST</span></div>
  <div class="preset-stepper">
    <button class="icon-btn" id="prevPreset" aria-label="Previous preset"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="preset-name" id="presetBtn" aria-label="Open presets"><b id="presetName">Init Voice</b><small id="presetBank">DMT CYMATICS</small></button>
    <button class="icon-btn" id="nextPreset" aria-label="Next preset"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

    <button class="tab" role="tab" id="tab-layers">LAYERS</button>

    <button class="tab" role="tab" id="tab-fx">FX</button>
  </nav>
  <div class="spacer"></div>
  <span class="status" id="voices">0 voices</span>
  <button class="icon-btn" id="kbdBtn" aria-label="Show or hide keyboard"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v9M12 5v9M16 5v9M8 14v5M12 14v5M16 14v5"/></svg></button>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</header>
<main>

  <section class="page" id="page-voice"></section>
  <section class="page" id="page-studio"></section>
  <section class="page" id="page-fx"></section>
</main>
<div class="keyboard-wrap" id="kbd">
  <div class="oct"><button id="octUp" aria-label="Octave up">+</button><span id="octLabel">C3</span><button id="octDown" aria-label="Octave down">−</button></div>
  <div class="keys" id="keys" aria-label="Keyboard"></div>
</div>
<div class="overlay" id="presetSheet" role="dialog" aria-label="Presets">
  <div class="sheet"><div class="sheet-head"><h2>PRESETS</h2><button class="btn filled" id="presetDone" style="--accent:#22E4FF">Done</button></div>
  <div class="sheet-body" id="presetBody"></div></div>
</div>
<div class="overlay" id="settingsSheet" role="dialog" aria-label="Settings">

  <div class="sheet-body single" id="settingsBody"></div></div>
</div>

<script id="dsp-src" type="text/plain">
// Vecta Vocal - JavaScript port of the C++ engine (DSP/), for the web test version.
// Dream Music Temple. Keep in step with DSP/*.hpp and DSP/*.cpp.
// Runs inside an AudioWorklet; the page also loads it to read the parameter table and draw the EQ curve.
'use strict';

const kPi = Math.PI, kTwoPi = 2 * Math.PI;
const clampf = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dbToLin = (db) => Math.pow(10, db * 0.05);
const linToDb = (l) => 20 * Math.log10(Math.max(l, 1e-9));
const semisToRatio = (s) => Math.pow(2, s / 12);
const midiToHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const onePoleCoef = (seconds, rate) => (seconds <= 0 ? 1 : 1 - Math.exp(-1 / (seconds * rate)));
const undenorm = (v) => (Math.abs(v) < 1e-20 ? 0 : v);

class Rng {
  constructor() { this.s = 0x9e3779b9; }
  seed(v) { this.s = (v >>> 0) || 0x9e3779b9; }
  next() {
    let s = this.s;
    s = (s ^ (s << 13)) >>> 0;
    s = (s ^ (s >>> 17)) >>> 0;
    s = (s ^ (s << 5)) >>> 0;
    this.s = s;
    return s;
  }
  uni() { return (this.next() >>> 8) * (1 / 16777216); }
  bi() { return this.uni() * 2 - 1; }
}

// ---------------------------------------------------------------- parameters

const kNumLayers = 4, kLayerStride = 100, kGlobalBase = 1000, kNumHarm = 4;
const L = {
  On: 0, Engine: 1, Level: 2, Pan: 3, VowelX: 4, VowelY: 5, FormantShift: 6, Breath: 7, Tense: 8,
  ShapeA: 9, ShapeB: 10, Throat: 11, Nasal: 12, Attack: 13, Decay: 14, Sustain: 15, Release: 16,
  TuneOn: 17, TuneSpeed: 18, Human: 19, Octave: 20, Semi: 21, Fine: 22,
  H1On: 23, H1Semi: 24, H1Fine: 25, H1Level: 26,
  Spread: 39, LowCut: 40, HighCut: 41, Drive: 42, FaceFollow: 43, Count: 44,
};
const G = {
  Master: 0, Key: 1, Scale: 2, Glide: 3, VibRate: 4, VibDepth: 5, VibDelay: 6, BendRange: 7, Mono: 8, VowelSeqOn: 9,
  MicModel: 10, MicProx: 11, MicDrive: 12,
  EqOn: 20, Eq1Freq: 21, Eq1Gain: 22, Eq1Q: 23,
  DeEssOn: 40, DeEssFreq: 41, DeEssThresh: 42, DeEssRange: 43,
  PopOn: 45, PopCutoff: 46, PopSens: 47,
  DlyOn: 50, DlyType: 51, DlyTime: 52, DlySync: 53, DlyFeedback: 54, DlyTone: 55, DlyMix: 56,
  RevOn: 60, RevType: 61, RevPreDelay: 62, RevDecay: 63, RevSize: 64, RevDamp: 65, RevMix: 66,
  LimiterOn: 70, Count: 71,
};
const E = { Formant: 0, Articulatory: 1, FOF: 2, Vocoder: 3 };
const U = { Generic: 0, Bool: 1, Indexed: 2, Hz: 3, dB: 4, Ms: 5, Sec: 6, Percent: 7, Semis: 8, Cents: 9 };
const kNumParams = kNumLayers * L.Count + G.Count;
const layerIndex = (layer, p) => layer * L.Count + p;
const globalIndex = (g) => kNumLayers * L.Count + g;
const layerAddress = (layer, p) => layer * kLayerStride + p;
const globalAddress = (g) => kGlobalBase + g;
function addressToIndex(a) {
  if (a >= kGlobalBase) { const g = a - kGlobalBase; return g >= 0 && g < G.Count ? globalIndex(g) : -1; }
  const l = Math.floor(a / kLayerStride), p = a % kLayerStride;
  return l < kNumLayers && p < L.Count ? layerIndex(l, p) : -1;
}

function buildParamTable() {
  const t = [];
  const add = (address, identifier, name, min, max, def, unit, labels = []) =>
    t.push({ address, identifier, name, min, max, def, unit, labels });
  const engines = ['Formant', 'Articulatory', 'FOF Grain', 'Vocoder'];
  for (let l = 0; l < kNumLayers; ++l) {
    const p = 'l' + (l + 1) + '_', n = 'L' + (l + 1) + ' ';
    const A = (i) => layerAddress(l, i);

      this.delay.process(Lb, Rb, n, Math.floor(this.gp(G.DlyType) + 0.5), timeMs, this.gp(G.DlyFeedback), this.gp(G.DlyTone), this.gp(G.DlyMix));
    }
    if (this.gp(G.RevOn) > 0.5) {
      this.reverb.configure(Math.floor(this.gp(G.RevType) + 0.5), this.gp(G.RevSize), this.gp(G.RevDecay), this.gp(G.RevDamp));
      this.reverb.process(Lb, Rb, n, this.gp(G.RevPreDelay), this.gp(G.RevMix));
    }
    const mTarget = this.gp(G.Master);
    for (let i = 0; i < n; ++i) { this.master += gC * (mTarget - this.master); const g = this.master * this.master * 1.6; Lb[i] *= g; Rb[i] *= g; }
    if (this.gp(G.LimiterOn) > 0.5) this.limiter.process(Lb, Rb, n, sr);

    let pl = 0, pr = 0, bad = false;
    for (let i = 0; i < n; ++i) {
      if (!(Lb[i] === Lb[i]) || !(Rb[i] === Rb[i]) || Math.abs(Lb[i]) > 64 || Math.abs(Rb[i]) > 64) { bad = true; Lb[i] = Rb[i] = 0; }
      Lb[i] = clampf(Lb[i], -4, 4); Rb[i] = clampf(Rb[i], -4, 4);
      pl = Math.max(pl, Math.abs(Lb[i])); pr = Math.max(pr, Math.abs(Rb[i]));
    }
    if (bad) {
      this.mic.reset(); this.pop.reset(); this.deEss.reset(); this.eq.reset(); this.delay.reset(); this.reverb.reset(); this.limiter.reset();
      for (const b of this.bus) { b.hp.reset(); b.lp.reset(); b.nasal1.reset(); b.nasal2.reset(); }
      for (const nt of this.notes) for (const v of nt.lv) v.resetFilters();
    }
    const decay = Math.exp(-dt / 0.3);
    this.peakL = Math.max(pl, this.peakL * decay); this.peakR = Math.max(pr, this.peakR * decay);
  }

  // EQ magnitude in dB for the interface (does not touch audio state).
  eqResponse(freqs, enabled, values) {
    const c = new BiquadCoef(), out = new Float64Array(freqs.length).fill(0);
    if (!enabled) return out;
    for (let b = 0; b < 6; ++b) {
      designEqBand(c, b, values[b * 3], values[b * 3 + 1], values[b * 3 + 2], this.sr);
      for (let i = 0; i < freqs.length; ++i) out[i] += linToDb(c.magnitude(Math.min(freqs[i], this.sr * 0.49), this.sr));
    }
    return out;
  }
}

const MANUAL = [{"title": "1. What Vecta Vocal is", "body": "Vecta Vocal is a vocal synthesiser by Dream Music Temple. It makes sung vowel sounds from four layers. Each layer can use a different kind of vocal synthesis, and the four are mixed, shaped and sent through a studio chain of microphone model, pop tamer, de-esser, equaliser, delay, reverb and limiter.\n\nIt runs as a standalone app on iPhone, iPad and Mac, and as an Audio Unit v3 instrument inside hosts such as Logic Pro, GarageBand, AUM and Cubasis."}, {"title": "2. Quick start", "body": "1. Play the on-screen keyboard, or connect a MIDI keyboard. The piano-keys button in the top bar shows or hides the keyboard, and + and \u2212 move it by octaves.\n2. Use the arrows either side of the preset name to step through presets. Tap the name to open the preset browser.\n3. Open the Voice page and drag the dot on the vowel pad. Left to right moves the tongue from front to back; top to bottom opens the mouth. I, E, A, O and U mark where those vowels sit.\n4. Turn a knob by dragging up or down on it. Double tap a knob to return it to its default."}, {"title": "3. Layers page", "body": "The four cards at the top are the layer mixer. Each has an On switch, an engine menu and a level. Tap a card to edit that layer in the panels below.\n\nEngines\n\u2022 Formant: a glottal source through five vowel filters. Clear and efficient. Shape A is Resonance (how sharp the formants are) and Shape B is Presence (extra energy in the upper formants).\n\u2022 Articulatory: a physical model of the vocal tract as a tube whose shape follows the vowel pad. Shape A is Tongue (0 is a relaxed tube, 1 exaggerates the shape) and Shape B is Lip round.\n\u2022 FOF Grain: short pulses ring a bank of formant resonators, the classic synthetic choir sound. Shape A is Skirt (pulse softness) and Shape B is Grain decay.\n\u2022 Vocoder: a saw or pulse carrier through a filter bank that follows the vowel. Shape A is the number of Bands (6 to 24) and Shape B is the Carrier (saw, then pulse, then added noise). This engine does not use the microphone.\n\nShaping\nFormant shifts the vowel colour up or down without changing the note. Throat sets the size of the singer, from a child (0.5) to a giant (2.5). Breath adds air. Tense moves from a soft, dark voice to a pressed, bright one. Nasal adds a nasal resonance.\n\nTone, Envelope and Pitch\nLow cut, High cut and Drive shape the layer before the mix. Pan places it and Spread fans successive notes across the stereo field. Attack, Decay, Sustain and Release set the loudness contour. Octave, Semitone and Fine transpose the layer.\n\nAutotune\nEach layer has its own Autotune switch. It pulls the pitch to the nearest note of the Key and Scale, which are shared by all layers. Speed is how fast it corrects: 0 ms gives the hard stepped effect, especially with Glide or pitch bend. Humanise adds the small natural pitch drift of a real singer; with autotune on, that drift is corrected at the chosen speed.\n\nExtra voices\nEach layer has two voices above (Up 1, Up 2) and two below (Down 1, Down 2). Oct and 5th set the interval to an octave or a fifth; press again for two octaves or an octave and a fifth. The interval knob sets any distance from 0 to 36 semitones, Fine detunes in cents and Level sets the volume. With Autotune on, the extra voices also snap to the scale, so they follow the key instead of staying strictly parallel."}, {"title": "4. Voice page", "body": "Vowel pad: choose a layer with L1 to L4, then drag. Each layer keeps its own vowel.\n\nPerformance: Glide slides between notes. Vibrato has rate, depth and a delay before it fades in. Bend sets the pitch bend range in semitones. Mono legato plays one note at a time and slides between overlapping notes.\n\nVowel sequence: type vowels such as A E I O U and switch Sequence on. Each new note sings the next vowel. The sequence restarts after two seconds of silence. It holds up to 32 steps and is saved with the preset.\n\nFace control (app only, iPhone and iPad with a TrueDepth camera): press Start face control and allow camera access. Opening your jaw opens the vowel, puckering moves it toward O and U, smiling moves it toward E and I, raising your brows adds vibrato, and tilting your head bends the pitch. Only layers with Follow face switched on respond. The camera image is processed on the device, is never recorded and never leaves it. Face control is not available inside the Audio Unit or on the Mac."}, {"title": "5. Studio page", "body": "Equaliser and spectrum: the cyan shape is the live output spectrum and the magenta line is the equaliser curve. Drag a numbered handle to move a band, or use the knobs below. Band 1 is a low cut, bands 2 to 5 are bells and band 6 is a high shelf.\n\nMicrophone model: colours the dry signal before the effects. Tube Condenser is warm with an airy top. Ribbon is dark and smooth with strong proximity. Broadcast Dynamic is tight and forward. FET Condenser is clean with a slight lift. Carbon Telephone is narrow and gritty. Proximity adds the low boost of singing close, and Drive adds saturation.\n\nDe-esser: reduces harsh energy around the chosen frequency when it rises above the threshold. Range limits how far it can reduce. The GR meter shows the reduction.\n\nPop tamer: holds back sudden low-frequency thumps. Cutoff sets what counts as low and Sens sets how readily it acts.\n\nOutput: level meters, Master volume and the Limiter, which keeps peaks under full scale."}, {"title": "6. FX page", "body": "Delay: Tape wobbles and saturates. Ping-pong bounces between left and right. Bucket is dark and gritty. Formant passes each echo through a moving vowel. Set Sync to a note value to follow the host tempo, or leave it on Free and use Time.\n\nReverb: Plate, Chamber, Hall, Spring, Shimmer (adds an octave above the tail) and Cathedral. Pre-delay separates the voice from the tail, Decay is the length, Size is the room, and Damping darkens the tail."}, {"title": "7. Presets", "body": "Tap the preset name to open the browser. There are two banks: User Artist holds your own presets, and DMT CYMATICS holds the factory presets.\n\n\u2022 Load plays the selected preset.\n\u2022 Save current sound as new stores everything in User Artist under the name and notes you typed.\n\u2022 Save name and notes renames a preset and stores its notes without changing its sound.\n\u2022 Overwrite with current sound replaces the selected preset's settings with what you hear now.\n\u2022 Copy to User Artist makes an editable copy.\n\u2022 Delete removes a user preset. Restore original undoes your changes to a DMT CYMATICS preset.\n\nA preset stores every control on every page, the vowel sequence, the name and the notes. Hosts also save the complete state with your project."}, {"title": "8. MIDI", "body": "Vecta Vocal responds to notes and velocity on all channels, pitch bend per channel, the mod wheel (vibrato), channel and poly pressure and CC 74 (brightness), the sustain pedal, and All Notes Off. Because bend and pressure are tracked per channel, MPE controllers work without extra setup.\n\nIn a host, every control is published as an automatable parameter. The standalone app listens to every connected MIDI source."}, {"title": "9. Settings and quality", "body": "Quality: sets how often pitch, vowel shape and filters are updated, which is what makes fast vowel and pitch movement sound smooth. Eco updates every 64 samples, Standard every 32, High every 16 and Ultra every 8. Eco also runs the Articulatory engine at the host sample rate instead of twice the rate, so it uses the least power. Polyphony sets how many notes can sound at once, from 1 to 16.\n\nProcessor use grows with notes \u00d7 layers switched on. The Articulatory engine is the heaviest and the Formant engine the lightest. If you hear crackles, lower the polyphony, switch off unused layers, choose Eco, or raise the host buffer size.\n\nDisplay: switch the spectrum analyser and the on-screen keyboard on or off."}, {"title": "10. Troubleshooting", "body": "No sound: check that at least one layer is On, Master is up, and on iPhone that the device is not muted in the host.\nNotes hang: send All Notes Off from the host, or release the sustain pedal.\nClicks when changing Throat on the Articulatory engine: the tract length changes in small steps, so set it before playing or automate it slowly.\nPresets saved in the app do not appear in the plug-in: both use a shared library only when the App Group is enabled for the build. See the developer notes that came with the project."}, {"title": "11. Credits", "body": "Vecta Vocal is developed and published by Dream Music Temple. Factory presets by DMT CYMATICS."}, {"title": "12. About this web version", "body": "This page is a test version of Vecta Vocal for trying the sound and the controls in a browser before the native app is built. It runs the same engine, ported line for line from the C++ code, and the same presets, pages and settings.\n\nDifferences from the native app:\n\u2022 Presets are kept in this browser. Use Export User Artist in the preset browser to back them up, and Import to load them on another device.\n\u2022 MIDI controllers work in Chrome and Edge (Web MIDI). Safari has no Web MIDI, so use the on-screen keyboard or the computer keys A W S E D F T G Y H U J K O L P and ; with Z and X to change octave.\n\u2022 There is no host, so delay sync uses the Tempo box on the FX page.\n\u2022 Face control uses the camera through Google's MediaPipe face model, loaded from the internet the first time. It is experimental here and works on most devices with a front camera, not only TrueDepth devices.\n\u2022 On iPhone and iPad, if you hear nothing, check the volume and try again after unlocking. Audio latency in a browser is higher than in the native app.\n\u2022 The settings, the page you were on and your current sound are remembered between visits."}];

function vowelPad(layer) {

  const dot = h('circle', { svg: true, r: 11, fill: color });

      store.set('vv.presets.user', userPresets().filter((x) => x.id !== sel.id)); browser.selected = null; renderBrowser();
    }, { color: C.magenta }));
    else if (JSON.stringify(factoryOriginal(sel.id)) !== JSON.stringify(sel)) actions.append(button('Restore original', () => {
      if (!confirm('Restore the original "' + factoryOriginal(sel.id).name + '"?')) return;
      const edits = store.get('vv.presets.factoryEdits', {}); delete edits[sel.id]; store.set('vv.presets.factoryEdits', edits);
      browser.selected = factoryOriginal(sel.id); renderBrowser();
    }, { color: C.magenta }));
  }
  const fileInput = h('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' }, onchange: importPresets });
  body.append(
    h('div', null,
      h('div', { class: 'bank-tabs' }, [BANK_USER, BANK_FACTORY].map((b) => h('button', { 'aria-pressed': browser.bank === b ? 'true' : 'false', onclick: () => { browser.bank = b; browser.selected = null; renderBrowser(); } }, b))),
      listEl),
    h('div', null,
      h('div', { class: 'field-label' }, 'NAME'), nameInput,
      h('div', { class: 'field-label' }, 'NOTES'), notesInput,
      h('div', { style: { height: '10px' } }), actions,
      h('div', { style: { height: '10px' } }),
      row(button('Save current sound as new', () => {
        const p = { id: newId(), name: nameInput.value.trim() || 'Untitled', notes: notesInput.value, bank: BANK_USER, artist: BANK_USER, values: snapshot(), vowelSequence };
        writePreset(p); currentPreset = { id: p.id, bank: p.bank, name: p.name, notes: p.notes }; updatePresetName();
        browser.bank = BANK_USER; browser.selected = p; renderBrowser(); toast('Saved to User Artist');
      }, { color: C.lime, filled: true }),
      button('Export User Artist', exportPresets), button('Import', () => fileInput.click()), fileInput),
      h('div', { style: { height: '10px' } }),
      note('A preset stores every control on every page, the vowel sequence, its name and these notes. New presets go to the User Artist bank. DMT CYMATICS presets can be renamed and edited too, and Restore original brings one back. In the web version presets are kept in this browser; use Export to back them up.')));
}
function exportPresets() {
  const blob = new Blob([JSON.stringify({ format: 'VectaVocalPresets', version: 1, presets: userPresets() }, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'Vecta Vocal - User Artist.json' });
  document.body.append(a); a.click(); a.remove();
}
function importPresets(e) {
  const file = e.target.files[0]; if (!file) return;
  file.text().then((text) => {
    const data = JSON.parse(text);
    const incoming = (data.presets || []).filter((p) => p && p.values && p.name);
    const list = userPresets();
    for (const p of incoming) { const copy = { ...p, bank: BANK_USER, artist: BANK_USER }; if (list.some((x) => x.id === copy.id)) copy.id = newId(); list.push(copy); }
    store.set('vv.presets.user', list); browser.bank = BANK_USER; renderBrowser(); toast('Imported ' + incoming.length + ' presets');
  }).catch(() => toast('That file is not a Vecta Vocal preset file.'));
}

// session autosave so a page reload keeps the sound
let saveTimer = 0;
function saveSessionNow() { clearTimeout(saveTimer); store.set('vv.session', { values: snapshot(), vowelSequence, preset: currentPreset }); }
function saveSessionSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveSessionNow, 400); }
window.addEventListener('pagehide', saveSessionNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveSessionNow(); });

// ---------------------------------------------------------------- settings and manual

const settings = store.get('vv.settings', { quality: 2, polyphony: 8, analyser: true, keyboard: true });
function saveSettings() { store.set('vv.settings', settings); }
function applySettings() {
  post({ type: 'quality', value: settings.quality }); post({ type: 'polyphony', value: settings.polyphony });
  $('kbd').classList.toggle('hidden', !settings.keyboard); $('kbdBtn').classList.toggle('active', settings.keyboard);
  if (settings.keyboard) requestAnimationFrame(buildKeys);
}
function openSettings() { renderSettings(); $('settingsSheet').classList.add('open'); }
function renderSettings(showManual = false) {
  const body = $('settingsBody'); body.textContent = '';
  if (showManual) {
    body.append(button('‹ Settings', () => renderSettings(false)),
      h('div', { class: 'manual' }, MANUAL.map((s) => [h('h4', null, s.title), h('p', null, s.body)])));
    body.scrollTop = 0; return;
  }
  const line = (a, b) => h('div', { class: 'line' }, h('span', null, a), h('span', null, b));
  const qSel = h('select', { 'aria-label': 'Quality', onchange: (e) => { settings.quality = Number(e.target.value); saveSettings(); applySettings(); } },
    ['Eco', 'Standard', 'High', 'Ultra'].map((n, i) => h('option', { value: i, selected: settings.quality === i }, n)));
  const polyNum = h('span', null, settings.polyphony + ' notes');
  const poly = h('span', { class: 'row' }, button('−', () => { settings.polyphony = Math.max(1, settings.polyphony - 1); polyNum.textContent = settings.polyphony + ' notes'; saveSettings(); applySettings(); }, { small: true }), polyNum,
    button('+', () => { settings.polyphony = Math.min(16, settings.polyphony + 1); polyNum.textContent = settings.polyphony + ' notes'; saveSettings(); applySettings(); }, { small: true }));
  const toggle = (key, label) => h('div', { class: 'line' }, h('span', null, label),
    h('button', { class: 'pill', 'aria-pressed': settings[key] ? 'true' : 'false', onclick: (e) => { settings[key] = !settings[key]; e.target.setAttribute('aria-pressed', settings[key] ? 'true' : 'false'); saveSettings(); applySettings(); } }, settings[key] ? 'On' : 'Off'));
  body.append(h('div', { class: 'settings' },
    h('section', null, h('h3', null, 'Sound quality'),
      h('div', { class: 'line' }, h('span', null, 'Quality'), h('label', { class: 'select' }, qSel)),
      h('div', { class: 'line' }, h('span', null, 'Polyphony'), poly),
      note('Higher quality updates pitch, vowel shape and filters more often: every 64 samples on Eco, 32 on Standard, 16 on High and 8 on Ultra. Eco also runs the Articulatory engine at the device sample rate instead of twice the rate. Lower the polyphony if you hear crackles. Each note plays every layer that is switched on.')),
    h('section', null, h('h3', null, 'Display'), toggle('analyser', 'Spectrum analyser'), toggle('keyboard', 'On-screen keyboard')),
    h('section', null, h('h3', null, 'MIDI'),
      line('Status', midiStatus), line('Notes', 'All channels, velocity sensitive'), line('Pitch bend', 'Per channel (MPE ready)'),
      line('Mod wheel (CC 1)', 'Vibrato depth'), line('Pressure and CC 74', 'Brightness'), line('Sustain (CC 64)', 'Hold notes'),
      line('Computer keys', 'A W S E D F T G Y H U J K O L P ;  ·  Z X octave')),
    h('section', null, h('h3', null, 'Help'), h('div', { class: 'line' }, h('span', null, 'User Manual'), button('Open', () => renderSettings(true)))),
    h('section', null, h('h3', null, 'About'), line('Product', 'Vecta Vocal'), line('Developer', 'Dream Music Temple'), line('Factory presets', 'DMT CYMATICS'),
      line('Version', 'Web test build ' + BUILD_DATE), line('Plug-in format', 'Audio Unit v3 instrument (native app)'), line('Audio', ctx ? ctx.sampleRate + ' Hz' : 'Not started'))));
}

// ---------------------------------------------------------------- start-up

function showPage(name) {
  for (const p of ['layers', 'voice', 'studio', 'fx']) {
    $('page-' + p).classList.toggle('active', p === name);
    $('tab-' + p).setAttribute('aria-selected', p === name ? 'true' : 'false');
  }
  store.set('vv.page', name);
}
function buildUI() {
  buildLayers(); buildVoice(); buildStudio(); buildFX();
  selectLayer(0);
  for (const p of ['layers', 'voice', 'studio', 'fx']) $('tab-' + p).onclick = () => showPage(p);
  showPage(store.get('vv.page', 'layers'));
  $('prevPreset').onclick = () => stepPreset(-1); $('nextPreset').onclick = () => stepPreset(1);
  $('presetBtn').onclick = openPresets; $('settingsBtn').onclick = openSettings;
  $('kbdBtn').onclick = () => { settings.keyboard = !settings.keyboard; saveSettings(); applySettings(); };
  for (const id of ['presetSheet', 'settingsSheet']) {
    $(id).addEventListener('click', (e) => { if (e.target.id === id) $(id).classList.remove('open'); });
  }
  $('presetDone').onclick = () => $('presetSheet').classList.remove('open');
  $('settingsDone').onclick = () => $('settingsSheet').classList.remove('open');
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('presetSheet').classList.remove('open'); $('settingsSheet').classList.remove('open'); } });
  setupKeyboard();
  const session = store.get('vv.session', null);
  if (session && session.values) { applyValues(session.values, session.vowelSequence ?? 'A E I O U'); currentPreset = session.preset || currentPreset; }
  else loadPreset(FACTORY_PRESETS[0]);
  if (seqInputEl) seqInputEl.value = vowelSequence;
  updatePresetName();
  requestAnimationFrame(drawAnalyser);
}

async function startAudio() {
  const btn = $('startBtn'); btn.disabled = true; btn.textContent = 'Starting…';
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    if (!ctx.audioWorklet) throw new Error('This browser does not support AudioWorklet. Use a current Safari, Chrome, Edge or Firefox.');
    const url = URL.createObjectURL(new Blob([DSP_SOURCE], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, 'vecta-vocal', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    analyser = ctx.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.6;
    node.connect(analyser); analyser.connect(ctx.destination);
    node.port.onmessage = (e) => { if (e.data.type === 'meters') onMeters(e.data); };
    // iPhone and iPad: playing a silent media element lets Web Audio sound even with the ring/silent switch on.
    try { const a = $('unmute'); a.loop = true; await a.play(); } catch (e) { /* not needed elsewhere */ }
    await ctx.resume();
    sendAllParams(); setSequence(vowelSequence); applySettings();
    post({ type: 'tempo', value: store.get('vv.tempo', 120) });
    $('start').remove();
    setupMIDI();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx.state !== 'running') ctx.resume(); });
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = 'Try again';
    $('startNote').textContent = 'Audio could not start: ' + (err.message || err);
  }
}

buildUI();
$('startBtn').onclick = startAudio;

</script>
